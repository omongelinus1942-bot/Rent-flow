<!-- Generates a branded navy/gold/orange app icon on a canvas at runtime (no external
     image file needed) and wires it up as the favicon, apple-touch-icon, and the
     icon(s) used when the app is installed or added to a phone's home screen. -->
<script>
(function () {
  function buildIcon(size, radius) {
    var canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext("2d");
    var r = radius;
    ctx.fillStyle = "#0F2A43"; // navy
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.arcTo(size, 0, size, size, r);
    ctx.arcTo(size, size, 0, size, r);
    ctx.arcTo(0, size, 0, 0, r);
    ctx.arcTo(0, 0, size, 0, r);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#E07A3E"; // orange base stripe
    ctx.fillRect(0, size * 0.86, size, size * 0.14);
    ctx.fillStyle = "#C9A227"; // gold monogram
    ctx.font = "bold " + Math.round(size * 0.44) + "px Sora, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("R", size / 2, size * 0.42);
    return canvas.toDataURL("image/png");
  }

  var icon192 = buildIcon(192, 34);
  var icon512 = buildIcon(512, 90);
  var iconApple = buildIcon(180, 36);

  function addLink(rel, href, sizes, type) {
    var l = document.createElement("link");
    l.rel = rel; l.href = href;
    if (sizes) l.sizes = sizes;
    if (type) l.type = type;
    document.head.appendChild(l);
  }
  addLink("icon", icon192, "192x192", "image/png");
  addLink("icon", icon512, "512x512", "image/png");
  addLink("apple-touch-icon", iconApple, "180x180");
  addLink("shortcut icon", icon192);

  var manifest = {
    name: "RentFlow — Rental Property Income & Expense Management",
    short_name: "RentFlow",
    start_url: ".",
    display: "standalone",
    background_color: "#F6F7F9",
    theme_color: "#E07A3E",
    icons: [
      { src: icon192, sizes: "192x192", type: "image/png", purpose: "any" },
      { src: icon512, sizes: "512x512", type: "image/png", purpose: "any" },
      { src: icon192, sizes: "192x192", type: "image/png", purpose: "maskable" },
      { src: icon512, sizes: "512x512", type: "image/png", purpose: "maskable" }
    ]
  };
  var blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
  addLink("manifest", URL.createObjectURL(blob));
})();
</script>

// Extracts { year, month } (month as "01".."12") from a "YYYY-MM-DD" or "YYYY-MM" string.
function periodOf(dateStr) {
  if (!dateStr) return { year: "", month: "" };
  const [y, m] = dateStr.split("-");
  return { year: y, month: m };
}
function matchesPeriod(dateStr, month, year) {
  if (!dateStr) return false;
  const { year: y, month: m } = periodOf(dateStr);
  return (month === "All" || m === month) && (year === "All" || y === year);
}

// Portfolio helpers: a portfolio groups one or more properties. "All Portfolios" passes everything.
function portfolioNameOf(propertyId, properties, portfolios) {
  const prop = properties.find(p => p.id === propertyId);
  if (!prop || !prop.portfolio) return "Unassigned";
  return portfolios.find(pf => pf.id === prop.portfolio)?.name || "Unassigned";
}
function propertiesInPortfolio(properties, portfolios, portfolioFilter) {
  if (portfolioFilter === "All Portfolios") return properties;
  if (portfolioFilter === "Unassigned") return properties.filter(p => !p.portfolio);
  const pf = portfolios.find(pf => pf.name === portfolioFilter);
  return properties.filter(p => p.portfolio === pf?.id);
}

/* Roles are now just two tiers: "admin" (the account owner, full access, manages Settings)
   and "user" (created by an admin, scoped to whatever pages/edit-rights that admin granted).
   Fine-grained per-page view/edit permissions live on each user's Firestore profile. */

/* A Firestore collection scoped to the signed-in account, with the same [data, setData]
   shape as useState — so every existing page's setPortfolios/setProperties/etc. call
   keeps working unchanged. setData(newArray) diffs against the last known list and
   writes only the adds/updates/deletes to Firestore; onSnapshot keeps everyone in the
   same account in sync in real time. */
function useFirestoreCollection(accountId, collectionName, seedData) {
  const [data, setDataRaw] = useState([]);
  const dataRef = useRef([]);
  const seededRef = useRef(false);

  useEffect(() => {
    if (!db || !accountId) { setDataRaw([]); return; }
    seededRef.current = false;
    const colRef = db.collection("accounts").doc(accountId).collection(collectionName);
    const unsub = colRef.onSnapshot(async (snap) => {
      if (snap.empty && !seededRef.current && seedData && seedData.length) {
        // First time this account touches this collection: seed it with starter data.
        seededRef.current = true;
        const batch = db.batch();
        seedData.forEach((item) => batch.set(colRef.doc(String(item.id)), item));
        try { await batch.commit(); } catch (e) { console.error("Seed failed:", e); }
        return; // onSnapshot fires again once the seed data lands
      }
      const list = snap.docs.map((d) => d.data());
      dataRef.current = list;
      setDataRaw(list);
    }, (err) => console.error(`${collectionName} sync error:`, err));
    return unsub;
  }, [accountId, collectionName]);

  const setData = useCallback((updater) => {
    if (!db || !accountId) return;
    const newList = typeof updater === "function" ? updater(dataRef.current) : updater;
    const oldList = dataRef.current;
    const colRef = db.collection("accounts").doc(accountId).collection(collectionName);
    const batch = db.batch();
    const newIds = new Set(newList.map((x) => String(x.id)));
    newList.forEach((item) => {
      const old = oldList.find((o) => o.id === item.id);
      if (!old || JSON.stringify(old) !== JSON.stringify(item)) {
        batch.set(colRef.doc(String(item.id)), item);
      }
    });
    oldList.forEach((item) => {
      if (!newIds.has(String(item.id))) batch.delete(colRef.doc(String(item.id)));
    });
    batch.commit().catch((e) => console.error(`${collectionName} write failed:`, e));
    dataRef.current = newList; // optimistic — onSnapshot will reconcile shortly after
    setDataRaw(newList);
  }, [accountId, collectionName]);

  return [data, setData];
}

async function clearSampleCollection(accountId, name) {
  const colRef = db.collection("accounts").doc(accountId).collection(name);
  // Firestore batches cap at 500 writes, so chunk defensively for larger collections.
  let snap = await colRef.get();
  while (!snap.empty) {
    const batch = db.batch();
    snap.docs.slice(0, 450).forEach((d) => batch.delete(d.ref));
    await batch.commit();
    snap = await colRef.get();
  }
}

async function seedSampleCollection(accountId, name, seed) {
  if (!seed || !seed.length) return;
  const colRef = db.collection("accounts").doc(accountId).collection(name);
  for (let i = 0; i < seed.length; i += 450) {
    const batch = db.batch();
    seed.slice(i, i + 450).forEach((item) => batch.set(colRef.doc(String(item.id)), item));
    await batch.commit();
  }
}

/* ---- Billing / arrears helpers ---- */
// The full monthly charge for renting a unit: rent + utilities + parking.
function computeUnitCharge(unit) {
  if (!unit) return 0;
  return (unit.rent || 0) + (unit.utilities || 0) + (unit.parking || 0);
}
function computeDiscountAmount(charge, discountType, discountValue) {
  const v = Number(discountValue || 0);
  if (discountType === "Percentage") return Math.round(charge * (v / 100));
  if (discountType === "Amount") return Math.min(v, charge);
  return 0;
}
// Net amount due for a payment record, after discount, plus any late penalty.
function computeAmountDue(unit, payment) {
  const charge = computeUnitCharge(unit);
  const discount = computeDiscountAmount(charge, payment?.discountType, payment?.discountValue);
  return Math.max(charge - discount, 0) + Number(payment?.penalty || 0);
}
// Outstanding balance for a single payment record (0 once Paid/Waived in full).
function computeBalance(unit, payment) {
  if (!payment) return computeUnitCharge(unit);
  if (payment.status === "Waived") return 0;
  const due = computeAmountDue(unit, payment);
  return Math.max(due - Number(payment.amount || 0), 0);
}
// Rent is treated as due on the 5th of its period month; returns 0 if not yet overdue.
function daysOverdue(payment, referenceDate = TODAY) {
  if (!payment?.period) return 0;
  const dueDate = new Date(payment.period + "-05");
  const ref = new Date(referenceDate);
  const diff = Math.round((ref - dueDate) / 86400000);
  return diff > 0 ? diff : 0;
}

/* ---- File upload helper (in-memory only; stored as a data URL for this session) ---- */
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, dataUrl: reader.result, size: file.size });
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---- Business logo upload helper: downsizes to a small PNG so it stores and loads
   quickly (Firestore document fields have a size limit, and a huge image would slow
   down every report/receipt export). ---- */
function readLogoAsDataURL(file, maxDim = 240) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width > maxDim || height > maxDim) {
          const scale = Math.min(maxDim / width, maxDim / height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/png"));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function toCSV(rows, columns) {
  const header = columns.map((c) => c.label).join(",");
  const body = rows.map((r) => columns.map((c) => {
    let v = typeof c.value === "function" ? c.value(r) : r[c.key];
    if (v === null || v === undefined) v = "";
    v = String(v).replace(/"/g, '""');
    return /[,"\n]/.test(v) ? `"${v}"` : v;
  }).join(",")).join("\n");
  const bizLine = businessHeaderLine();
  const topHeader = bizLine ? bizLine + "\n\n" : "";
  return topHeader + header + "\n" + body + "\n\n" + FOOTER_TEXT;
}
function downloadCSV(filename, csvString) {
  const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Neat, branded PDF export: title, optional subtitle/summary lines, a table, and a
// footer with the Omlin Consultancy credit + page numbers on every page.
function exportPDF({ title, subtitle, summary, columns, rows, filename, orientation = "landscape" }) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation, unit: "mm", format: "a4" });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();

  const bizName = (BUSINESS_INFO.name || "").trim();
  const bizContact = businessContactLine();
  const hasLogo = !!BUSINESS_INFO.logo;

  // Business identity, printed at the same size as the report title, sits above
  // the coloured band so it's the first thing anyone sees on the download.
  let topOffset = 0;
  if (bizName) {
    doc.setFont("helvetica", "bold");
    doc.setFontSize(15);
    doc.setTextColor(15, 42, 67);
    doc.text(bizName, 14, 10);
    topOffset = 12;
    if (bizContact) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8.5);
      doc.setTextColor(107, 118, 132);
      doc.text(bizContact, 14, 15.5);
      topOffset = 17;
    }
  }

  // Branded header band: navy fill, gold + orange accent stripes.
  const bandHeight = 22;
  const bandY = topOffset;
  doc.setFillColor(15, 42, 67);
  doc.rect(0, bandY, pageWidth, bandHeight, "F");
  doc.setFillColor(201, 162, 39);
  doc.rect(0, bandY + bandHeight, pageWidth, 1.1, "F");
  doc.setFillColor(224, 122, 62);
  doc.rect(0, bandY + bandHeight + 1.1, pageWidth, 1.1, "F");

  // Icon mark: the uploaded business logo, or the app's own icon if none is set.
  if (hasLogo) {
    try { doc.addImage(BUSINESS_INFO.logo, "PNG", 14, bandY + 5, 12, 12); }
    catch (e) {
      doc.setFillColor(201, 162, 39);
      doc.roundedRect(14, bandY + 5, 12, 12, 2.5, 2.5, "F");
      doc.setFont("helvetica", "bold");
      doc.setFontSize(12);
      doc.setTextColor(15, 42, 67);
      doc.text("R", 18.6, bandY + 13.7);
    }
  } else {
    doc.setFillColor(201, 162, 39);
    doc.roundedRect(14, bandY + 5, 12, 12, 2.5, 2.5, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.setTextColor(15, 42, 67);
    doc.text("R", 18.6, bandY + 13.7);
  }

  doc.setFont("helvetica", "bold");
  doc.setFontSize(15);
  doc.setTextColor(255, 255, 255);
  doc.text(title, 30, bandY + 11.5);

  let cursorY = bandY + bandHeight + 10;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9.5);
  doc.setTextColor(107, 118, 132);
  if (subtitle) { doc.text(subtitle, 14, cursorY); cursorY += 6; }

  if (summary && summary.length) {
    doc.setFontSize(9.5);
    doc.setTextColor(27, 122, 77);
    summary.forEach((line) => { doc.text(line, 14, cursorY); cursorY += 5; });
    cursorY += 2;
  }

  doc.autoTable({
    startY: cursorY,
    head: [columns.map((c) => c.label)],
    body: rows.map((r) => columns.map((c) => {
      const v = typeof c.value === "function" ? c.value(r) : r[c.key];
      return v === null || v === undefined ? "" : String(v);
    })),
    styles: { fontSize: 8, cellPadding: 2.5, textColor: [22, 32, 42] },
    headStyles: { fillColor: [15, 42, 67], textColor: 255, fontStyle: "bold" },
    alternateRowStyles: { fillColor: [246, 247, 249] },
    margin: { left: 14, right: 14, bottom: 18 },
    didDrawPage: () => {
      const pageCount = doc.internal.getNumberOfPages();
      const pageNo = doc.internal.getCurrentPageInfo().pageNumber;
      doc.setDrawColor(224, 122, 62);
      doc.setLineWidth(0.6);
      doc.line(14, pageHeight - 13, pageWidth - 14, pageHeight - 13);
      doc.setFontSize(8);
      doc.setTextColor(140, 160, 179);
      doc.text(FOOTER_TEXT, 14, pageHeight - 8);
      doc.text(`Page ${pageNo} of ${pageCount}`, pageWidth - 30, pageHeight - 8);
    },
  });

  doc.save((filename || title).replace(/\s+/g, "_").toLowerCase() + ".pdf");
}

// A file input that reads the chosen file into memory (data URL) so it can be
// previewed/downloaded within this session. Nothing is uploaded to a server.
function FileUploadField({ label, value, onChange, dark, accept }) {
  const [busy, setBusy] = useState(false);
  async function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setBusy(true);
    try {
      const result = await readFileAsDataURL(file);
      onChange(result);
    } finally {
      setBusy(false);
      e.target.value = "";
    }
  }
  return (
    <Field label={label}>
      {value ? (
        <div className="flex items-center gap-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle(dark)}>
          <Icon name="description" size={15} style={{ color: COLORS.green }} />
          <a href={value.dataUrl} target="_blank" rel="noopener noreferrer" className="truncate flex-1 hover:underline" style={{ color: dark ? COLORS.textDark : COLORS.textLight }}>{value.name}</a>
          <button type="button" onClick={() => onChange(null)} className="shrink-0"><Icon name="close" size={14} style={{ color: COLORS.red }} /></button>
        </div>
      ) : (
        <label className="flex items-center justify-center gap-2 px-3 py-2 rounded-lg border border-dashed text-sm cursor-pointer" style={inputStyle(dark)}>
          <Icon name="upload_file" size={15} style={{ color: dark ? COLORS.subDark : COLORS.subLight }} />
          <span style={{ color: dark ? COLORS.subDark : COLORS.subLight }}>{busy ? "Uploading…" : "Choose file"}</span>
          <input type="file" accept={accept} className="hidden" onChange={handleFile} />
        </label>
      )}
    </Field>
  );
}

/* ============================== DATA TABLE ============================== */
function DataTable({ columns, rows, dark, pageSize = 8, onRowClick, defaultSort }) {
  const [page, setPage] = useState(0);
  const [sortKey, setSortKey] = useState(defaultSort?.key || null);
  const [sortDir, setSortDir] = useState(defaultSort?.dir || "asc");

  const sortedRows = useMemo(() => {
    if (!sortKey) return rows;
    const col = columns.find((c) => c.key === sortKey);
    const getVal = (col && col.sortValue) || ((r) => r[sortKey]);
    const arr = [...rows];
    arr.sort((a, b) => {
      let av = getVal(a), bv = getVal(b);
      if (av === null || av === undefined || av === "") return 1;
      if (bv === null || bv === undefined || bv === "") return -1;
      if (typeof av === "string" || typeof bv === "string") {
        av = String(av).toLowerCase(); bv = String(bv).toLowerCase();
        return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
      }
      return sortDir === "asc" ? av - bv : bv - av;
    });
    return arr;
  }, [rows, sortKey, sortDir, columns]);

  const totalPages = Math.max(1, Math.ceil(sortedRows.length / pageSize));
  const pageRows = sortedRows.slice(page * pageSize, page * pageSize + pageSize);
  React.useEffect(() => { if (page >= totalPages) setPage(0); }, [sortedRows.length]);

  function toggleSort(c) {
    if (c.sortable === false || c.key === "actions") return;
    if (sortKey === c.key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(c.key); setSortDir("asc"); }
  }

  if (rows.length === 0) return <EmptyState dark={dark} label="Try adjusting your filters or add a new record." />;

  return (
    <div className="overflow-x-auto">
      <table className="w-full text-sm border-collapse min-w-[640px]">
        <thead>
          <tr className="border-b" style={{ borderColor: dark ? COLORS.borderDark : COLORS.borderLight }}>
            {columns.map((c) => {
              const sortable = c.sortable !== false && c.key !== "actions";
              const active = sortKey === c.key;
              return (
                <th key={c.key} onClick={() => toggleSort(c)}
                  className={`text-left px-3 py-2.5 font-medium text-xs uppercase tracking-wide whitespace-nowrap ${sortable ? "cursor-pointer select-none hover:opacity-80" : ""}`}
                  style={{ color: active ? (dark ? COLORS.textDark : COLORS.textLight) : (dark ? COLORS.subDark : COLORS.subLight) }}>
                  <span className="inline-flex items-center gap-0.5">
                    {c.label}
                    {sortable && (
                      <Icon name={active ? (sortDir === "asc" ? "arrow_upward" : "arrow_downward") : "unfold_more"} size={12} style={{ opacity: active ? 1 : 0.35 }} />
                    )}
                  </span>
                </th>
              );
            })}
          </tr>
        </thead>
        <tbody>
          {pageRows.map((r, i) => (
            <tr key={r.id || i} onClick={() => onRowClick && onRowClick(r)}
              className={`border-b last:border-0 ${onRowClick ? "cursor-pointer hover:opacity-80" : ""}`}
              style={{ borderColor: dark ? COLORS.borderDark : "#F0F1F3" }}>
              {columns.map((c) => (
                <td key={c.key} className="px-3 py-2.5 whitespace-nowrap" style={{ color: dark ? COLORS.textDark : COLORS.textLight }}>
                  {c.render ? c.render(r) : r[c.key]}
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
      {totalPages > 1 && (
        <div className="flex items-center justify-between px-1 pt-3">
          <span className="text-xs" style={{ color: dark ? COLORS.subDark : COLORS.subLight }}>
            Page {page + 1} of {totalPages} · {sortedRows.length} records
          </span>
          <div className="flex gap-1">
            <button disabled={page === 0} onClick={() => setPage((p) => p - 1)} className="p-1.5 rounded-lg border disabled:opacity-30" style={{ borderColor: dark ? COLORS.borderDark : COLORS.borderLight }}>
              <Icon name="chevron_left" size={14} style={{ color: dark ? COLORS.textDark : COLORS.textLight }} />
            </button>
            <button disabled={page >= totalPages - 1} onClick={() => setPage((p) => p + 1)} className="p-1.5 rounded-lg border disabled:opacity-30" style={{ borderColor: dark ? COLORS.borderDark : COLORS.borderLight }}>
              <Icon name="chevron_right" size={14} style={{ color: dark ? COLORS.textDark : COLORS.textLight }} />
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================== PAGE: DASHBOARD ============================== */
function Dashboard({ dark, properties, units, tenants, payments, expenses, income, maintenance, portfolios }) {
  const [month, setMonth] = useState("07");
  const [year, setYear] = useState("2026");
  const [portfolioFilter, setPortfolioFilter] = useState("All Portfolios");
  const periodLabel = (month === "All" ? "All months" : monthLabel(month)) + (year === "All" ? "" : " " + year);
  const portfolioOptions = ["All Portfolios", ...portfolios.map(pf => pf.name), "Unassigned"];

  const propsInPortfolio = useMemo(() => propertiesInPortfolio(properties, portfolios, portfolioFilter), [properties, portfolios, portfolioFilter]);
  const unitsInScope = useMemo(() => units.filter(u => propsInPortfolio.some(p => p.id === u.property)), [units, propsInPortfolio]);
  const maintenanceInScope = useMemo(() => maintenance.filter(m => propsInPortfolio.some(p => p.id === m.property)), [maintenance, propsInPortfolio]);

  const fPayments = useMemo(() => payments.filter(p => matchesPeriod(p.period || p.date, month, year) && propsInPortfolio.some(pr => pr.id === p.property)), [payments, month, year, propsInPortfolio]);
  const fExpenses = useMemo(() => expenses.filter(e => matchesPeriod(e.date, month, year) && propsInPortfolio.some(pr => pr.id === e.property)), [expenses, month, year, propsInPortfolio]);

  const totalRentIncome = fPayments.filter(p => p.type === "Rent").reduce((s, p) => s + p.amount, 0);
  const totalExpenses = fExpenses.reduce((s, e) => s + e.amount, 0);
  const otherIncome = totalOtherIncome(income, propsInPortfolio, month, year);
  const noi = totalRentIncome + otherIncome - totalExpenses;
  const occupied = unitsInScope.filter(u => u.status === "Occupied").length;
  const occupancyRate = unitsInScope.length ? Math.round((occupied / unitsInScope.length) * 100) : 0;
  const vacant = unitsInScope.filter(u => u.status === "Vacant").length;
  const underMaint = unitsInScope.filter(u => u.status === "Under Maintenance").length;
  const outstanding = fPayments.filter(p => p.status === "Overdue" || p.status === "Partial")
    .reduce((s, p) => s + (units.find(u => u.id === p.unit)?.rent || 0) - p.amount, 0);
  const collectionRate = Math.round((totalRentIncome / (totalRentIncome + Math.max(outstanding, 0))) * 100) || 0;
  const avgRent = unitsInScope.length ? Math.round(unitsInScope.reduce((s, u) => s + u.rent, 0) / unitsInScope.length) : 0;
  const expenseRatio = Math.round((totalExpenses / (totalRentIncome + otherIncome)) * 100) || 0;
  const upcomingLeases = unitsInScope.filter(u => u.leaseEnd && (new Date(u.leaseEnd) - new Date(TODAY)) / 86400000 < 60 && (new Date(u.leaseEnd) - new Date(TODAY)) > 0).length;
  const waivedCount = fPayments.filter(p => p.status === "Waived").length;

  const expenseByCategory = useMemo(() => {
    const map = {};
    fExpenses.forEach(e => { map[e.category] = (map[e.category] || 0) + e.amount; });
    return Object.entries(map).map(([name, value]) => ({ name, value }));
  }, [fExpenses]);

  const propPerf = propsInPortfolio.map(p => {
    const pPayments = fPayments.filter(pay => pay.property === p.id && pay.type === "Rent");
    const income = pPayments.reduce((s, pay) => s + pay.amount, 0);
    return { name: p.name.split(" ")[0], income };
  }).sort((a, b) => b.income - a.income);

  const sub = dark ? COLORS.subDark : COLORS.subLight;
  const txt = dark ? COLORS.textDark : COLORS.textLight;

  return (
    <div className="flex flex-col gap-5">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <p className="text-xs" style={{ color: sub }}>Showing financial figures for <span style={{ color: txt, fontWeight: 500 }}>{periodLabel}</span>{portfolioFilter !== "All Portfolios" ? <> · <span style={{ color: txt, fontWeight: 500 }}>{portfolioFilter}</span></> : null}</p>
        <div className="flex items-center gap-1.5">
          <Select value={portfolioFilter} onChange={setPortfolioFilter} options={portfolioOptions} dark={dark} />
          <MonthYearFilter month={month} year={year} onMonth={setMonth} onYear={setYear} dark={dark} />
        </div>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3">
        <KPICard dark={dark} icon="account_balance_wallet" label="Rental Income" value={fmtKES(totalRentIncome)} sub={periodLabel} accent={COLORS.green} />
        <KPICard dark={dark} icon="north_east" label="Other Income" value={fmtKES(otherIncome)} sub="Parking, fees & more" accent={COLORS.gold} />
        <KPICard dark={dark} icon="south_east" label="Total Expenses" value={fmtKES(totalExpenses)} sub={periodLabel} accent={COLORS.orange} />
        <KPICard dark={dark} icon="trending_up" label="Net Operating Income" value={fmtKES(noi)} sub="Income − expenses" accent={COLORS.navy} />
        <KPICard dark={dark} icon="home" label="Occupancy Rate" value={occupancyRate + "%"} sub={`${occupied} of ${unitsInScope.length} units`} accent={COLORS.green} />
        <KPICard dark={dark} icon="check_circle" label="Collection Rate" value={collectionRate + "%"} sub="Of rent billed" accent={COLORS.greenSoft} />
        <KPICard dark={dark} icon="warning" label="Outstanding Rent" value={fmtKES(Math.max(outstanding, 0))} sub="Overdue & partial" accent={COLORS.red} />
        <KPICard dark={dark} icon="apartment" label="Vacant Units" value={vacant} sub={`${underMaint} under maintenance`} accent={COLORS.subLight} />
        <KPICard dark={dark} icon="schedule" label="Lease Expiries" value={upcomingLeases} sub="Within 60 days" accent={COLORS.gold} />
        <KPICard dark={dark} icon="account_balance_wallet" label="Avg Rent / Unit" value={fmtKES(avgRent)} sub="Across selection" accent={COLORS.navy} />
        <KPICard dark={dark} icon="receipt_long" label="Expense Ratio" value={expenseRatio + "%"} sub="Of gross income" accent={COLORS.orange} />
        <KPICard dark={dark} icon="build" label="Open Tickets" value={maintenanceInScope.filter(m => m.status !== "Completed").length} sub={waivedCount ? `${waivedCount} rent waiver(s) this period` : "Maintenance items"} accent={COLORS.red} />
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-3 gap-4">
        <Card dark={dark} className="p-5 xl:col-span-2">
          <h3 className="text-sm font-semibold mb-4" style={{ color: txt, fontFamily: "'Sora', sans-serif" }}>Income vs Expenses (6 months)</h3>
          <ResponsiveContainer width="100%" height={260}>
            <AreaChart data={INCOME_TREND}>
              <defs>

function PortfoliosPage({ dark, portfolios, setPortfolios, properties, setProperties, units, access }) {
  const [search, setSearch] = useState("");
  const [modal, setModal] = useState(null);

  const filtered = portfolios.filter(pf => pf.name.toLowerCase().includes(search.toLowerCase()));

  function save(form) {
    if (form.id) setPortfolios(portfolios.map(pf => pf.id === form.id ? form : pf));
    else setPortfolios([{ ...form, id: uid("PF") }, ...portfolios]);
    setModal(null);
  }
  // Removing a portfolio never deletes its properties — they're simply unassigned.
  function remove(id) {
    setPortfolios(portfolios.filter(pf => pf.id !== id));
    setProperties(properties.map(p => p.portfolio === id ? { ...p, portfolio: null } : p));
  }

  const columns = [
    { key: "name", label: "Portfolio", render: (r) => <span className="font-medium">{r.name}</span> },
    { key: "manager", label: "Managed By" },
    { key: "properties", label: "Properties", render: (r) => properties.filter(p => p.portfolio === r.id).length, sortValue: (r) => properties.filter(p => p.portfolio === r.id).length },
    { key: "unitsCount", label: "Units", render: (r) => { const propIds = properties.filter(p => p.portfolio === r.id).map(p => p.id); return units.filter(u => propIds.includes(u.property)).length; }, sortValue: (r) => { const propIds = properties.filter(p => p.portfolio === r.id).map(p => p.id); return units.filter(u => propIds.includes(u.property)).length; } },
    { key: "remarks", label: "Remarks", sortable: false, render: (r) => <span className="text-xs" style={{ color: dark ? COLORS.subDark : COLORS.subLight }}>{r.remarks || "—"}</span> },
    { key: "actions", label: "", sortable: false, render: (r) => (
      <div className="flex gap-1">
        {access.canEdit && <button onClick={(e) => { e.stopPropagation(); setModal(r); }} className="p-1.5 rounded-lg hover:opacity-70"><Icon name="edit" size={14} style={{ color: dark ? COLORS.subDark : COLORS.subLight }} /></button>}
        {access.canDelete && <button onClick={(e) => { e.stopPropagation(); remove(r.id); }} className="p-1.5 rounded-lg hover:opacity-70" title="Remove portfolio (properties become unassigned)"><Icon name="delete" size={14} style={{ color: COLORS.red }} /></button>}
      </div>
    ) },
  ];

  return (
    <div>
      <Toolbar search={search} onSearch={setSearch} dark={dark}>
        {access.canEdit && <Button icon="add" onClick={() => setModal({})}>Add Portfolio</Button>}
      </Toolbar>
      <Card dark={dark} className="p-4">
        <DataTable columns={columns} rows={filtered} dark={dark} />
      </Card>
      {modal !== null && <PortfolioModal dark={dark} initial={modal} onClose={() => setModal(null)} onSave={save} />}
    </div>
  );
}

      <Card dark={dark} className="p-4"><DataTable columns={columns} rows={filtered} dark={dark} /></Card>
      {history && <PaymentHistoryModal dark={dark} tenantId={history} payments={payments} units={units} tenants={tenants} onClose={() => setHistory(null)} />}
      {modal !== null && <TenantModal dark={dark} initial={modal} units={units} properties={properties} onClose={() => setModal(null)} onSave={save} />}
    </div>
  );
}

function TenantModal({ dark, initial, units, properties, onClose, onSave }) {
  const initialUnit = units.find(u => u.id === initial.unit);
  const [selectedProperty, setSelectedProperty] = useState(initial.property || initialUnit?.property || properties[0]?.id || "");
  const [form, setForm] = useState({
    name: "", phone: "", email: "", idNo: "", employer: "", occupation: "", unit: initial.unit || "",
    property: initial.property || "", deposit: "", status: "Active", remarks: "",
    leaseStart: initial.leaseStart || initialUnit?.leaseStart || "", leaseEnd: initial.leaseEnd || initialUnit?.leaseEnd || "",
    leaseAgreement: initial.leaseAgreement || null, idCopy: initial.idCopy || null, ...initial,
  });
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const unitsForProperty = units.filter(u => u.property === selectedProperty)
    .sort((a, b) => (a.status === "Vacant" ? -1 : 1) - (b.status === "Vacant" ? -1 : 1));

  function handlePropertyChange(propId) {
    setSelectedProperty(propId);
    const firstUnit = units.find(u => u.property === propId);
    setForm({ ...form, property: propId, unit: firstUnit?.id || "", leaseStart: firstUnit?.leaseStart || "", leaseEnd: firstUnit?.leaseEnd || "" });
  }
  function handleUnitChange(unitId) {
    const u = units.find(u => u.id === unitId);
    setForm({ ...form, unit: unitId, leaseStart: form.leaseStart || u?.leaseStart || "", leaseEnd: form.leaseEnd || u?.leaseEnd || "" });
  }

  return (
    <Modal title={initial.id ? "Edit Tenant" : "Add Tenant"} onClose={onClose} dark={dark} wide>
      <form onSubmit={(e) => { e.preventDefault(); onSave({ ...form, deposit: Number(form.deposit) }); }} className="grid grid-cols-2 gap-3">
        <Field label="Full Name"><input required value={form.name} onChange={set("name")} className={inputCls} style={inputStyle(dark)} /></Field>
        <Field label="Phone Number"><input required value={form.phone} onChange={set("phone")} className={inputCls} style={inputStyle(dark)} /></Field>
        <Field label="Email"><input type="email" value={form.email} onChange={set("email")} className={inputCls} style={inputStyle(dark)} /></Field>
        <Field label="National ID / Passport"><input value={form.idNo} onChange={set("idNo")} className={inputCls} style={inputStyle(dark)} /></Field>
        <Field label="Employer"><input value={form.employer} onChange={set("employer")} className={inputCls} style={inputStyle(dark)} /></Field>
        <Field label="Occupation"><input value={form.occupation} onChange={set("occupation")} className={inputCls} style={inputStyle(dark)} /></Field>
        <Field label="Property">
          <select value={selectedProperty} onChange={(e) => handlePropertyChange(e.target.value)} className={inputCls} style={inputStyle(dark)}>
            {properties.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </Field>
        <Field label="Assigned Unit">
          <select value={form.unit} onChange={(e) => handleUnitChange(e.target.value)} className={inputCls} style={inputStyle(dark)}>
            {unitsForProperty.length === 0 && <option value="">No units on this property</option>}
            {unitsForProperty.map(u => <option key={u.id} value={u.id}>{u.unitNo} — {u.type} {u.status !== "Vacant" ? `(${u.status})` : ""}</option>)}
          </select>
        </Field>
        <Field label="Deposit Paid (KES)"><input required type="number" value={form.deposit} onChange={set("deposit")} className={inputCls} style={inputStyle(dark)} /></Field>
        <Field label="Status">
          <select value={form.status} onChange={set("status")} className={inputCls} style={inputStyle(dark)}>
            <option>Active</option><option>Notice</option><option>Vacated</option>
          </select>
        </Field>
        <Field label="Lease Start Date"><input type="date" value={form.leaseStart || ""} onChange={set("leaseStart")} className={inputCls} style={inputStyle(dark)} /></Field>
        <Field label="Lease End Date"><input type="date" value={form.leaseEnd || ""} onChange={set("leaseEnd")} className={inputCls} style={inputStyle(dark)} /></Field>
        <FileUploadField label="Lease Agreement" value={form.leaseAgreement} onChange={(v) => setForm({ ...form, leaseAgreement: v })} dark={dark} accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" />
        <FileUploadField label="ID / Passport Copy" value={form.idCopy} onChange={(v) => setForm({ ...form, idCopy: v })} dark={dark} accept=".pdf,.jpg,.jpeg,.png" />
        <div className="col-span-2">
          <Field label="Remarks"><textarea rows={2} value={form.remarks} onChange={set("remarks")} placeholder="Optional notes about this tenant" className={inputCls} style={inputStyle(dark)} /></Field>
        </div>
        <div className="col-span-2 flex justify-end gap-2 pt-2">
          <Button variant="secondary" dark={dark} onClick={onClose}>Cancel</Button>
          <Button type="submit">Save Tenant</Button>

/* ============================== PAGE: PAYMENTS ============================== */
function PaymentsPage({ dark, payments, setPayments, tenants, units, properties, portfolios, access }) {
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("All Statuses");
  const [portfolioFilter, setPortfolioFilter] = useState("All Portfolios");
  const [propFilter, setPropFilter] = useState("All Properties");
  const [month, setMonth] = useState("07");
  const [year, setYear] = useState("2026");
  const [modal, setModal] = useState(null);
  const [receipt, setReceipt] = useState(null);
  const statusOptions = ["All Statuses", "Paid", "Partial", "Overdue", "Waived"];
  const portfolioOptions = ["All Portfolios", ...portfolios.map(pf => pf.name), "Unassigned"];
  const propsInPortfolio = propertiesInPortfolio(properties, portfolios, portfolioFilter);
  const propOptions = ["All Properties", ...propsInPortfolio.map(p => p.name)];

  const filtered = payments.filter(p => {
    const t = tenants.find(t => t.id === p.tenant);
    const propName = properties.find(pr => pr.id === p.property)?.name;
    return (statusFilter === "All Statuses" || p.status === statusFilter) &&
      propsInPortfolio.some(pr => pr.id === p.property) &&
      (propFilter === "All Properties" || propName === propFilter) &&
      matchesPeriod(p.period || p.date, month, year) &&
      ((t?.name || "").toLowerCase().includes(search.toLowerCase()) || p.id.toLowerCase().includes(search.toLowerCase()));
  });
  const periodTotal = filtered.filter(p => p.status !== "Waived").reduce((s, p) => s + p.amount, 0);
  const waivedTotal = filtered.filter(p => p.status === "Waived").length;
  const balanceTotal = filtered.reduce((s, p) => s + computeBalance(units.find(u => u.id === p.unit), p), 0);

  function save(form) {
    if (form.id) setPayments(payments.map(p => p.id === form.id ? form : p));
    else setPayments([{ ...form, id: uid("PAY") }, ...payments]);
    setModal(null);
  }
  function remove(id) { setPayments(payments.filter(p => p.id !== id)); }

  const exportColumns = [
    { key: "id", label: "Payment ID" },
    { key: "period", label: "Period", value: (r) => r.period ? monthLabel(r.period.split("-")[1]) + " " + r.period.split("-")[0] : "" },
    { key: "tenant", label: "Tenant", value: (r) => tenants.find(t => t.id === r.tenant)?.name },
    { key: "unit", label: "Unit", value: (r) => units.find(u => u.id === r.unit)?.unitNo },
    { key: "amount", label: "Amount (KES)" }, { key: "method", label: "Method" }, { key: "status", label: "Status" },
    { key: "balance", label: "Balance (KES)", value: (r) => computeBalance(units.find(u => u.id === r.unit), r) },
    { key: "remarks", label: "Remarks" },
  ];
  function exportCsv() { downloadCSV("rent_collection.csv", toCSV(filtered, exportColumns)); }
  function exportPdf() {
    exportPDF({
      title: "Rent Collection Report",
      subtitle: `${portfolioFilter} · ${propFilter} · ${(month === "All" ? "All months" : monthLabel(month))}${year === "All" ? "" : " " + year} · Generated ${fmtDate(TODAY)}`,
      summary: [
        `Collected: ${fmtKES(periodTotal)}   |   Outstanding balance: ${fmtKES(balanceTotal)}   |   Records: ${filtered.length}   |   Waived: ${waivedTotal}`,
      ],
      columns: exportColumns, rows: filtered, filename: "rent_collection",
    });
  }

  const columns = [
    { key: "id", label: "Payment ID" },
    { key: "period", label: "Period", render: (r) => r.period ? monthLabel(r.period.split("-")[1]) + " " + r.period.split("-")[0] : "—" },
    { key: "tenant", label: "Tenant", render: (r) => tenants.find(t => t.id === r.tenant)?.name || "—", sortValue: (r) => tenants.find(t => t.id === r.tenant)?.name || "" },
    { key: "unit", label: "Unit", render: (r) => units.find(u => u.id === r.unit)?.unitNo || "—", sortValue: (r) => units.find(u => u.id === r.unit)?.unitNo || "" },
    { key: "amount", label: "Amount", render: (r) => fmtKES(r.amount) },
    { key: "balance", label: "Balance", render: (r) => { const b = computeBalance(units.find(u => u.id === r.unit), r); return <span style={{ color: b > 0 ? COLORS.red : COLORS.green, fontWeight: 500 }}>{fmtKES(b)}</span>; }, sortValue: (r) => computeBalance(units.find(u => u.id === r.unit), r) },
    { key: "method", label: "Method" },
    { key: "status", label: "Status", render: (r) => <Badge status={r.status} /> },
    { key: "actions", label: "", sortable: false, render: (r) => (
      <div className="flex gap-1">
        <button onClick={(e) => { e.stopPropagation(); setReceipt(r); }} className="p-1.5 rounded-lg hover:opacity-70" title="Generate receipt"><Icon name="receipt_long" size={14} style={{ color: COLORS.green }} /></button>
        {access.canEdit && <button onClick={(e) => { e.stopPropagation(); setModal(r); }} className="p-1.5 rounded-lg hover:opacity-70"><Icon name="edit" size={14} style={{ color: dark ? COLORS.subDark : COLORS.subLight }} /></button>}
        {access.canDelete && <button onClick={(e) => { e.stopPropagation(); remove(r.id); }} className="p-1.5 rounded-lg hover:opacity-70"><Icon name="delete" size={14} style={{ color: COLORS.red }} /></button>}
      </div>
    ) },
  ];

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
        <p className="text-xs" style={{ color: dark ? COLORS.subDark : COLORS.subLight }}>
          Collected {fmtKES(periodTotal)} · Outstanding {fmtKES(balanceTotal)} for {(month === "All" ? "all months" : monthLabel(month))}{year === "All" ? "" : " " + year}
          {waivedTotal ? ` · ${waivedTotal} waived` : ""}
        </p>
        <MonthYearFilter month={month} year={year} onMonth={setMonth} onYear={setYear} dark={dark} />
      </div>
      <Toolbar search={search} onSearch={setSearch} dark={dark}>
        <Select value={portfolioFilter} onChange={(v) => { setPortfolioFilter(v); setPropFilter("All Properties"); }} options={portfolioOptions} dark={dark} />
        <Select value={propFilter} onChange={setPropFilter} options={propOptions} dark={dark} />
        <Select value={statusFilter} onChange={setStatusFilter} options={statusOptions} dark={dark} />
        <Button variant="secondary" dark={dark} icon="download" onClick={exportCsv}>CSV</Button>
        <Button variant="secondary" dark={dark} icon="picture_as_pdf" onClick={exportPdf}>PDF</Button>
        {access.canEdit && <Button icon="add" onClick={() => setModal({})}>Record Payment</Button>}
      </Toolbar>
      <Card dark={dark} className="p-4"><DataTable columns={columns} rows={filtered} dark={dark} /></Card>
      {modal !== null && <PaymentModal dark={dark} initial={modal} tenants={tenants} units={units} onClose={() => setModal(null)} onSave={save} />}
      {receipt && <ReceiptModal dark={dark} payment={receipt} tenants={tenants} units={units} properties={properties} onClose={() => setReceipt(null)} />}
    </div>
  );
}

function PaymentModal({ dark, initial, tenants, units, onClose, onSave }) {
  const initialPeriod = initial.period ? periodOf(initial.period + "-01") : { year: "2026", month: "07" };
  const [form, setForm] = useState({
    date: "2026-07-14", tenant: tenants[0]?.id || "", unit: tenants[0]?.unit || "", property: tenants[0]?.property || "",
    amount: "", method: "M-Pesa", type: "Rent", status: "Paid", remarks: "",
    discountType: "None", discountValue: 0, penalty: 0, ...initial,
  });
  const [pMonth, setPMonth] = useState(initialPeriod.month);
  const [pYear, setPYear] = useState(initialPeriod.year);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  function markWaived() {
    setForm({ ...form, status: "Waived", amount: 0, method: "-" });
  }
  const unit = units.find(u => u.id === form.unit);
  const charge = computeUnitCharge(unit);
  const discountAmt = computeDiscountAmount(charge, form.discountType, form.discountValue);
  const due = Math.max(charge - discountAmt, 0) + Number(form.penalty || 0);
  const previewBalance = form.status === "Waived" ? 0 : Math.max(due - Number(form.amount || 0), 0);

  return (
    <Modal title={initial.id ? "Edit Payment" : "Record Payment"} onClose={onClose} dark={dark} wide>
      <form onSubmit={(e) => { e.preventDefault(); onSave({ ...form, amount: Number(form.amount), discountValue: Number(form.discountValue || 0), penalty: Number(form.penalty || 0), period: `${pYear}-${pMonth}` }); }} className="grid grid-cols-2 gap-3">
        <Field label="Date"><input required type="date" value={form.date} onChange={set("date")} className={inputCls} style={inputStyle(dark)} /></Field>
        <Field label="Tenant">
          <select value={form.tenant} onChange={(e) => { const t = tenants.find(t => t.id === e.target.value); setForm({ ...form, tenant: e.target.value, unit: t?.unit, property: t?.property }); }} className={inputCls} style={inputStyle(dark)}>
            {tenants.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
        </Field>
        <Field label="Rent Period — Month">
          <select value={pMonth} onChange={(e) => setPMonth(e.target.value)} className={inputCls} style={inputStyle(dark)}>
            {MONTH_OPTIONS.filter(m => m.value !== "All").map(m => <option key={m.value} value={m.value}>{m.label}</option>)}
          </select>
        </Field>
        <Field label="Rent Period — Year">
          <select value={pYear} onChange={(e) => setPYear(e.target.value)} className={inputCls} style={inputStyle(dark)}>
            {YEAR_OPTIONS.filter(y => y !== "All").map(y => <option key={y} value={y}>{y}</option>)}
          </select>
        </Field>
        <Field label="Unit Charge (rent + utilities + parking)">
          <div className={inputCls} style={{ ...inputStyle(dark), background: dark ? COLORS.navyDeep : "#F6F7F9" }}>{fmtKES(charge)}</div>
        </Field>
        <Field label="Amount Paid (KES)"><input required type="number" value={form.amount} onChange={set("amount")} className={inputCls} style={inputStyle(dark)} disabled={form.status === "Waived"} /></Field>
        <Field label="Discount Type">
          <select value={form.discountType} onChange={set("discountType")} className={inputCls} style={inputStyle(dark)}>
            <option>None</option><option>Percentage</option><option>Amount</option>
          </select>
        </Field>
        <Field label={form.discountType === "Percentage" ? "Discount (%)" : "Discount (KES)"}>
          <input type="number" value={form.discountValue} onChange={set("discountValue")} className={inputCls} style={inputStyle(dark)} disabled={form.discountType === "None"} />
        </Field>
        <Field label="Late Payment Penalty (KES)"><input type="number" value={form.penalty} onChange={set("penalty")} className={inputCls} style={inputStyle(dark)} /></Field>
        <Field label="Payment Method">
          <select value={form.method} onChange={set("method")} className={inputCls} style={inputStyle(dark)} disabled={form.status === "Waived"}>
            {["Cash", "Bank Transfer", "M-Pesa", "Card", "Cheque", "-"].map(m => <option key={m}>{m}</option>)}
          </select>
        </Field>
        <Field label="Type">
          <select value={form.type} onChange={set("type")} className={inputCls} style={inputStyle(dark)}>
            <option>Rent</option><option>Parking</option><option>Utility Reimbursement</option><option>Service Charge</option><option>Penalty</option><option>Other</option>
          </select>
        </Field>
        <Field label="Status">
          <select value={form.status} onChange={set("status")} className={inputCls} style={inputStyle(dark)}>
            <option>Paid</option><option>Partial</option><option>Overdue</option><option>Waived</option>
          </select>
        </Field>
        <Field label="Balance Due (after discount &amp; penalty)">
          <div className={inputCls} style={{ ...inputStyle(dark), background: dark ? COLORS.navyDeep : "#F6F7F9", color: previewBalance > 0 ? COLORS.red : COLORS.green, fontWeight: 600 }}>{fmtKES(previewBalance)}</div>
        </Field>
        <div className="col-span-2 -mt-1">
          <button type="button" onClick={markWaived} className="text-xs font-medium underline" style={{ color: COLORS.gold }}>Waive this rent period</button>
        </div>
        <div className="col-span-2">
          <Field label="Remarks">
            <textarea rows={2} value={form.remarks} onChange={set("remarks")} placeholder={form.status === "Waived" ? "Reason for waiving rent (required)" : "Optional notes about this payment"} className={inputCls} style={inputStyle(dark)} required={form.status === "Waived"} />
          </Field>
        </div>
        <div className="col-span-2 flex justify-end gap-2 pt-2">
          <Button variant="secondary" dark={dark} onClick={onClose}>Cancel</Button>

        </div>
      </form>
    </Modal>
  );
}

/* Printable / downloadable rent receipt for a single payment. */
function ReceiptModal({ dark, payment, tenants, units, properties, onClose }) {
  const tenant = tenants.find(t => t.id === payment.tenant);
  const unit = units.find(u => u.id === payment.unit);
  const property = properties.find(p => p.id === payment.property);
  const charge = computeUnitCharge(unit);
  const discountAmt = computeDiscountAmount(charge, payment.discountType, payment.discountValue);
  const balance = computeBalance(unit, payment);
  const periodText = payment.period ? monthLabel(payment.period.split("-")[1]) + " " + payment.period.split("-")[0] : "—";

  const lines = [
    ["Tenant", tenant?.name || "—"],
    ["Property", property?.name || "—"],
    ["Unit", unit?.unitNo || "—"],
    ["Rent Period", periodText],
    ["Date Paid", fmtDate(payment.date)],
    ["Payment Method", payment.method],
    ["Unit Charge", fmtKES(charge)],
    ["Discount", payment.discountType !== "None" && payment.discountType ? `${payment.discountType === "Percentage" ? payment.discountValue + "%" : fmtKES(payment.discountValue)} (${fmtKES(discountAmt)})` : "—"],
    ["Late Penalty", payment.penalty ? fmtKES(payment.penalty) : "—"],
    ["Amount Paid", fmtKES(payment.amount)],
    ["Balance Remaining", fmtKES(balance)],
    ["Status", payment.status],
  ];

  function downloadPdf() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a5" });
    const w = doc.internal.pageSize.getWidth();
    const h = doc.internal.pageSize.getHeight();

    const bizName = (BUSINESS_INFO.name || "").trim();
    const bizContact = businessContactLine();
    const hasLogo = !!BUSINESS_INFO.logo;

    // Business identity, printed at the same size as the receipt title, sits above
    // the coloured band so it's the first thing anyone sees on the download.
    let topOffset = 0;
    if (bizName) {
      doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(15, 42, 67);
      doc.text(bizName, 10, 9);
      topOffset = 11;
      if (bizContact) {
        doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(107, 118, 132);
        doc.text(bizContact, 10, 13.5);
        topOffset = 15;
      }
    }

    // Branded header band: navy fill, gold + orange accent stripes.
    const bandHeight = 22;
    const bandY = topOffset;
    doc.setFillColor(15, 42, 67);
    doc.rect(0, bandY, w, bandHeight, "F");
    doc.setFillColor(201, 162, 39);
    doc.rect(0, bandY + bandHeight, w, 1, "F");
    doc.setFillColor(224, 122, 62);
    doc.rect(0, bandY + bandHeight + 1, w, 1, "F");

    // Icon mark: the uploaded business logo, or the app's own icon if none is set.
    if (hasLogo) {
      try { doc.addImage(BUSINESS_INFO.logo, "PNG", 10, bandY + 5, 11, 11); }
      catch (e) {
        doc.setFillColor(201, 162, 39);
        doc.roundedRect(10, bandY + 5, 11, 11, 2.5, 2.5, "F");
        doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(15, 42, 67);
        doc.text("R", 14.2, bandY + 13.2);
      }
    } else {
      doc.setFillColor(201, 162, 39);
      doc.roundedRect(10, bandY + 5, 11, 11, 2.5, 2.5, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(15, 42, 67);
      doc.text("R", 14.2, bandY + 13.2);
    }
    doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(255, 255, 255);
    doc.text("Rent Payment Receipt", 25, bandY + 11.5);

    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(107, 118, 132);
    let bodyStartY = bandY + bandHeight + 8;
    doc.text(`Receipt No: ${payment.id}`, 14, bodyStartY);
    doc.text(`Issued: ${fmtDate(TODAY)}`, w - 55, bodyStartY);
    doc.autoTable({
      startY: bodyStartY + 4,
      body: lines.map(([k, v]) => [k, v]),
      theme: "plain",
      styles: { fontSize: 10, cellPadding: 1.8, textColor: [22, 32, 42] },
      columnStyles: { 0: { fontStyle: "bold", textColor: [107, 118, 132], cellWidth: 45 } },
      margin: { left: 14, right: 14 },
    });
    doc.setDrawColor(224, 122, 62);
    doc.setLineWidth(0.6);
    doc.line(14, h - 20, w - 14, h - 20);
    doc.setFontSize(8); doc.setTextColor(140, 160, 179);
    doc.text(FOOTER_TEXT, 14, h - 12);
    doc.save(`receipt_${payment.id}.pdf`);
  }

  return (
    <Modal title="Rent Payment Receipt" onClose={onClose} dark={dark}>
      <div className="rounded-xl border p-4 mb-4" style={{ borderColor: dark ? COLORS.borderDark : COLORS.borderLight }}>
        <div className="flex items-center justify-between mb-3">
          <div>
            <div className="text-xs" style={{ color: dark ? COLORS.subDark : COLORS.subLight }}>Receipt No.</div>
            <div className="font-semibold" style={{ fontFamily: "'Sora', sans-serif" }}>{payment.id}</div>
          </div>
          <Badge status={payment.status} />
        </div>
        <div className="flex flex-col gap-1.5">
          {lines.map(([k, v]) => (
            <div key={k} className="flex justify-between text-sm">
              <span style={{ color: dark ? COLORS.subDark : COLORS.subLight }}>{k}</span>
              <span className="font-medium">{v}</span>
            </div>
          ))}
        </div>
        <p className="text-[11px] text-center pt-4 mt-3 border-t" style={{ color: dark ? COLORS.subDark : COLORS.subLight, borderColor: dark ? COLORS.borderDark : COLORS.borderLight }}>{FOOTER_TEXT}</p>
      </div>
      <div className="flex justify-end gap-2">
        <Button variant="secondary" dark={dark} onClick={onClose}>Close</Button>
        <Button icon="download" onClick={downloadPdf}>Download PDF</Button>
      </div>
    </Modal>
  );
}

/* ============================== PAGE: OTHER INCOME ============================== */
function IncomePage({ dark, income, setIncome, properties, units, portfolios, access }) {
  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("All Categories");
  const [portfolioFilter, setPortfolioFilter] = useState("All Portfolios");

/* Total received across all Other Income records — imported by the Dashboard for its KPI. */

        <div className="col-span-2">
          <Field label="Remarks"><textarea rows={2} value={form.remarks} onChange={set("remarks")} placeholder="Optional notes or completion remarks" className={inputCls} style={inputStyle(dark)} /></Field>

/* ============================== PAGE: ARREARS MANAGEMENT ============================== */
function ArrearsPage({ dark, payments, setPayments, tenants, units, properties, portfolios, access }) {
  const [search, setSearch] = useState("");
  const [portfolioFilter, setPortfolioFilter] = useState("All Portfolios");
  const [propFilter, setPropFilter] = useState("All Properties");
  const [unitFilter, setUnitFilter] = useState("All Units");
  const [penaltyFor, setPenaltyFor] = useState(null);
  const [history, setHistory] = useState(null);
  const portfolioOptions = ["All Portfolios", ...portfolios.map(pf => pf.name), "Unassigned"];
  const propsInPortfolio = propertiesInPortfolio(properties, portfolios, portfolioFilter);
  const propOptions = ["All Properties", ...propsInPortfolio.map(p => p.name)];
  const unitsForFilter = propFilter === "All Properties" ? units.filter(u => propsInPortfolio.some(p => p.id === u.property)) : units.filter(u => properties.find(p => p.id === u.property)?.name === propFilter);
  const unitOptions = ["All Units", ...unitsForFilter.map(u => u.unitNo)];

  // Arrears = the latest recorded rent period per tenant, where it is Overdue or Partial.
  const latestPerTenant = useMemo(() => {
    const map = {};
    payments.filter(p => p.type === "Rent").forEach(p => {
      const existing = map[p.tenant];
      if (!existing || (p.period || p.date) > (existing.period || existing.date)) map[p.tenant] = p;
    });
    return Object.values(map);
  }, [payments]);

  const arrears = latestPerTenant
    .filter(p => p.status === "Overdue" || p.status === "Partial")
    .map(p => {
      const tenant = tenants.find(t => t.id === p.tenant);
      const unit = units.find(u => u.id === p.unit);
      const property = properties.find(pr => pr.id === p.property);
      return { ...p, tenantName: tenant?.name, tenantPhone: tenant?.phone, unitNo: unit?.unitNo, propertyName: property?.name, balance: computeBalance(unit, p), overdue: daysOverdue(p) };
    })
    .filter(r =>
      propsInPortfolio.some(p => p.id === r.property) &&
      (propFilter === "All Properties" || r.propertyName === propFilter) &&
      (unitFilter === "All Units" || r.unitNo === unitFilter) &&
      ((r.tenantName || "").toLowerCase().includes(search.toLowerCase()))
    );

  const totalOutstanding = arrears.reduce((s, r) => s + r.balance, 0);
  const totalPenalties = arrears.reduce((s, r) => s + Number(r.penalty || 0), 0);
  const avgOverdue = arrears.length ? Math.round(arrears.reduce((s, r) => s + r.overdue, 0) / arrears.length) : 0;

  function applyPenalty(paymentId, amount, note) {
    setPayments(payments.map(p => p.id === paymentId
      ? { ...p, penalty: Number(p.penalty || 0) + Number(amount || 0), remarks: (p.remarks ? p.remarks + " · " : "") + note }
      : p));
    setPenaltyFor(null);
  }

  const exportColumns = [
    { key: "tenantName", label: "Tenant" }, { key: "tenantPhone", label: "Phone" },
    { key: "unitNo", label: "Unit" }, { key: "propertyName", label: "Property" },
    { key: "period", label: "Period" }, { key: "amount", label: "Paid (KES)" },
    { key: "balance", label: "Balance (KES)" }, { key: "overdue", label: "Days Overdue" },
    { key: "penalty", label: "Penalty (KES)" }, { key: "status", label: "Status" },
  ];
  function exportPdf() {
    exportPDF({
      title: "Arrears Management Report",
      subtitle: `${portfolioFilter} · ${propFilter} · ${unitFilter} · Generated ${fmtDate(TODAY)}`,
      summary: [`Tenants in arrears: ${arrears.length}   |   Total outstanding: ${fmtKES(totalOutstanding)}   |   Avg. days overdue: ${avgOverdue}   |   Penalties applied: ${fmtKES(totalPenalties)}`],
      columns: exportColumns, rows: arrears, filename: "arrears_report",
    });
  }
  function exportCsv() { downloadCSV("arrears_report.csv", toCSV(arrears, exportColumns)); }

  const columns = [
    { key: "tenantName", label: "Tenant", render: (r) => (
      <div><div className="font-medium">{r.tenantName}</div><div className="text-xs" style={{ color: dark ? COLORS.subDark : COLORS.subLight }}>{r.tenantPhone}</div></div>
    ) },
    { key: "unitNo", label: "Unit" },
    { key: "propertyName", label: "Property" },
    { key: "period", label: "Period", render: (r) => r.period ? monthLabel(r.period.split("-")[1]) + " " + r.period.split("-")[0] : "—" },
    { key: "amount", label: "Paid", render: (r) => fmtKES(r.amount) },
    { key: "balance", label: "Balance Due", render: (r) => <span style={{ color: COLORS.red, fontWeight: 600 }}>{fmtKES(r.balance)}</span> },
    { key: "overdue", label: "Days Overdue", render: (r) => <span style={{ color: r.overdue > 14 ? COLORS.red : COLORS.orange, fontWeight: 500 }}>{r.overdue}</span> },
    { key: "penalty", label: "Penalty", render: (r) => r.penalty ? fmtKES(r.penalty) : "—" },
    { key: "status", label: "Status", render: (r) => <Badge status={r.status} /> },
    { key: "actions", label: "", sortable: false, render: (r) => (
      <div className="flex gap-1">
        <button onClick={(e) => { e.stopPropagation(); setHistory(r.tenant); }} className="p-1.5 rounded-lg hover:opacity-70" title="Payment history"><Icon name="history" size={14} style={{ color: dark ? COLORS.subDark : COLORS.subLight }} /></button>
        {access.canEdit && <button onClick={(e) => { e.stopPropagation(); setPenaltyFor(r); }} className="p-1.5 rounded-lg hover:opacity-70" title="Apply late penalty"><Icon name="gavel" size={14} style={{ color: COLORS.orange }} /></button>}
      </div>
    ) },
  ];

  return (
    <div className="flex flex-col gap-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <KPICard dark={dark} icon="assignment_late" label="Tenants in Arrears" value={arrears.length} sub="Overdue or partial" accent={COLORS.red} />
        <KPICard dark={dark} icon="account_balance_wallet" label="Total Outstanding" value={fmtKES(totalOutstanding)} sub="Across selected filters" accent={COLORS.orange} />
        <KPICard dark={dark} icon="schedule" label="Avg. Days Overdue" value={avgOverdue} sub="Since rent due date" accent={COLORS.gold} />
        <KPICard dark={dark} icon="gavel" label="Penalties Applied" value={fmtKES(totalPenalties)} sub="Late payment fees" accent={COLORS.navy} />
      </div>
      <Toolbar search={search} onSearch={setSearch} dark={dark}>
        <Select value={portfolioFilter} onChange={(v) => { setPortfolioFilter(v); setPropFilter("All Properties"); setUnitFilter("All Units"); }} options={portfolioOptions} dark={dark} />
        <Select value={propFilter} onChange={(v) => { setPropFilter(v); setUnitFilter("All Units"); }} options={propOptions} dark={dark} />
        <Select value={unitFilter} onChange={setUnitFilter} options={unitOptions} dark={dark} />
        <Button variant="secondary" dark={dark} icon="download" onClick={exportCsv}>CSV</Button>
        <Button variant="secondary" dark={dark} icon="picture_as_pdf" onClick={exportPdf}>PDF</Button>
      </Toolbar>
      <Card dark={dark} className="p-4">
        <DataTable columns={columns} rows={arrears} dark={dark} defaultSort={{ key: "balance", dir: "desc" }} />
      </Card>
      {history && <PaymentHistoryModal dark={dark} tenantId={history} payments={payments} units={units} tenants={tenants} onClose={() => setHistory(null)} />}
      {penaltyFor && <PenaltyModal dark={dark} row={penaltyFor} onClose={() => setPenaltyFor(null)} onApply={applyPenalty} />}
    </div>
  );
}

function PaymentHistoryModal({ dark, tenantId, payments, units, tenants, onClose }) {
  const tenant = tenants.find(t => t.id === tenantId);
  const rows = payments.filter(p => p.tenant === tenantId && p.type === "Rent")
    .sort((a, b) => (b.period || b.date).localeCompare(a.period || a.date));
  const columns = [
    { key: "period", label: "Period", render: (r) => r.period ? monthLabel(r.period.split("-")[1]) + " " + r.period.split("-")[0] : "—" },
    { key: "date", label: "Date Paid", render: (r) => fmtDate(r.date) },
    { key: "amount", label: "Amount", render: (r) => fmtKES(r.amount) },
    { key: "balance", label: "Balance", render: (r) => fmtKES(computeBalance(units.find(u => u.id === r.unit), r)) },
    { key: "status", label: "Status", render: (r) => <Badge status={r.status} /> },
  ];
  return (
    <Modal title={`Payment History — ${tenant?.name || ""}`} onClose={onClose} dark={dark} wide>
      <DataTable columns={columns} rows={rows} dark={dark} pageSize={12} defaultSort={{ key: "period", dir: "desc" }} />
    </Modal>
  );
}

function PenaltyModal({ dark, row, onClose, onApply }) {
  const [amount, setAmount] = useState(Math.round((row.balance || 0) * 0.05) || 500);
  const [note, setNote] = useState("");
  return (
    <Modal title="Apply Late Payment Penalty" onClose={onClose} dark={dark}>
      <div className="flex flex-col gap-3">
        <p className="text-sm" style={{ color: dark ? COLORS.subDark : COLORS.subLight }}>
          {row.tenantName} — {row.unitNo}, {row.propertyName} · currently {row.overdue} day{row.overdue === 1 ? "" : "s"} overdue.
        </p>
        <Field label="Penalty Amount (KES)"><input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} className={inputCls} style={inputStyle(dark)} /></Field>
        <Field label="Reason / Note"><textarea rows={2} value={note} onChange={(e) => setNote(e.target.value)} placeholder="e.g. 5% late fee for July rent" className={inputCls} style={inputStyle(dark)} /></Field>
        <div className="flex justify-end gap-2 pt-2">
          <Button variant="secondary" dark={dark} onClick={onClose}>Cancel</Button>
          <Button onClick={() => onApply(row.id, amount, note || "Late payment penalty applied")}>Apply Penalty</Button>
        </div>
      </div>
    </Modal>
  );
}

/* ============================== PAGE: REPORTS ============================== */
const REPORT_TYPES = [
  "Monthly Income Report", "Expense Report", "Profit & Loss Statement", "Occupancy Report",
  "Rent Arrears Report", "Property Performance Report", "Lease Expiry Report", "Maintenance Cost Report",
];

const REPORT_FILTERS = {
  "Monthly Income Report": ["property", "unit", "tenant"],
  "Expense Report": ["property", "category"],
  "Profit & Loss Statement": ["property"],
  "Occupancy Report": ["property"],
  "Rent Arrears Report": ["property", "unit", "tenant"],
  "Property Performance Report": [],
  "Lease Expiry Report": ["property"],
  "Maintenance Cost Report": ["property", "category"],
};
const EXPENSE_CATEGORIES = ["All Categories", "Utilities", "Maintenance", "Salaries", "Insurance", "Taxes", "Marketing", "Security", "Cleaning", "Landscaping", "Fuel", "Office Costs", "Custom"];
const MAINTENANCE_CATEGORIES = ["All Categories", "General", "Electrical", "Plumbing", "Landscaping", "Structural", "Appliance"];

function ReportsPage({ dark, properties, units, tenants, payments, expenses, maintenance, portfolios }) {
  const [reportType, setReportType] = useState(REPORT_TYPES[0]);
  const [month, setMonth] = useState("All");
  const [year, setYear] = useState("All");
  const [portfolioFilter, setPortfolioFilter] = useState("All Portfolios");
  const [propFilter, setPropFilter] = useState("All Properties");
  const [unitFilter, setUnitFilter] = useState("All Units");
  const [tenantFilter, setTenantFilter] = useState("All Tenants");
  const [categoryFilter, setCategoryFilter] = useState("All Categories");

  const periodLabel = (month === "All" ? "All months" : monthLabel(month)) + (year === "All" ? "" : " " + year);
  const periodApplies = !["Occupancy Report", "Property Performance Report"].includes(reportType);
  const activeFilters = REPORT_FILTERS[reportType] || [];
  const portfolioOptions = ["All Portfolios", ...portfolios.map(pf => pf.name), "Unassigned"];
  const propsInPortfolio = propertiesInPortfolio(properties, portfolios, portfolioFilter);
  const propOptions = ["All Properties", ...propsInPortfolio.map(p => p.name)];
  const unitsForFilter = propFilter === "All Properties" ? units.filter(u => propsInPortfolio.some(p => p.id === u.property)) : units.filter(u => properties.find(p => p.id === u.property)?.name === propFilter);
  const unitOptions = ["All Units", ...unitsForFilter.map(u => u.unitNo)];
  const tenantOptions = ["All Tenants", ...tenants.filter(t => propFilter === "All Properties" || properties.find(p => p.id === t.property)?.name === propFilter).map(t => t.name)];
  const filterSummary = [
    portfolioFilter !== "All Portfolios" ? portfolioFilter : null,
    activeFilters.includes("property") && propFilter !== "All Properties" ? propFilter : null,
    activeFilters.includes("unit") && unitFilter !== "All Units" ? `Unit ${unitFilter}` : null,
    activeFilters.includes("tenant") && tenantFilter !== "All Tenants" ? tenantFilter : null,
    activeFilters.includes("category") && categoryFilter !== "All Categories" ? categoryFilter : null,
  ].filter(Boolean).join(" · ");

  const matchesProp = (id) => propsInPortfolio.some(p => p.id === id) && (propFilter === "All Properties" || properties.find(p => p.id === id)?.name === propFilter);
  const matchesUnit = (id) => unitFilter === "All Units" || units.find(u => u.id === id)?.unitNo === unitFilter;
  const matchesTenant = (id) => tenantFilter === "All Tenants" || tenants.find(t => t.id === id)?.name === tenantFilter;
  const matchesCategory = (c) => categoryFilter === "All Categories" || c === categoryFilter;

  const fPayments = useMemo(() => payments.filter(p =>
    matchesPeriod(p.period || p.date, month, year) && matchesProp(p.property) && matchesUnit(p.unit) && matchesTenant(p.tenant)
  ), [payments, month, year, portfolioFilter, propFilter, unitFilter, tenantFilter]);
  const fExpenses = useMemo(() => expenses.filter(e =>
    matchesPeriod(e.date, month, year) && matchesProp(e.property) && matchesCategory(e.category)
  ), [expenses, month, year, portfolioFilter, propFilter, categoryFilter]);
  const fMaintenance = useMemo(() => maintenance.filter(m =>
    matchesPeriod(m.dateReported, month, year) && matchesProp(m.property) && matchesCategory(m.category)
  ), [maintenance, month, year, portfolioFilter, propFilter, categoryFilter]);
  const fUnitsByLease = useMemo(() => units.filter(u => matchesPeriod(u.leaseEnd, month, year) && matchesProp(u.property)), [units, month, year, portfolioFilter, propFilter]);
  const fUnitsByProp = useMemo(() => units.filter(u => matchesProp(u.property)), [units, portfolioFilter, propFilter]);
  const fPropsFiltered = useMemo(() => propsInPortfolio.filter(p => propFilter === "All Properties" || p.name === propFilter), [propsInPortfolio, propFilter]);

  const data = useMemo(() => {
    switch (reportType) {
      case "Monthly Income Report": {
        const total = fPayments.reduce((s, p) => s + p.amount, 0);
        const paid = fPayments.filter(p => p.status === "Paid").length;
        const partial = fPayments.filter(p => p.status === "Partial").length;
        const overdue = fPayments.filter(p => p.status === "Overdue").length;
        const waived = fPayments.filter(p => p.status === "Waived").length;
        return {
          columns: [
            { key: "id", label: "Payment ID" },
            { key: "date", label: "Date", render: (r) => fmtDate(r.date), value: (r) => fmtDate(r.date) },
            { key: "tenant", label: "Tenant", render: (r) => tenants.find(t => t.id === r.tenant)?.name, value: (r) => tenants.find(t => t.id === r.tenant)?.name, sortValue: (r) => tenants.find(t => t.id === r.tenant)?.name || "" },
            { key: "amount", label: "Amount", render: (r) => fmtKES(r.amount), value: (r) => r.amount },
            { key: "status", label: "Status", render: (r) => <Badge status={r.status} />, value: (r) => r.status },
            { key: "remarks", label: "Remarks", sortable: false },
          ],
          rows: fPayments, total,
          summary: [
            { label: "Total Collected", value: fmtKES(total) }, { label: "Payments", value: fPayments.length },
            { label: "Average Payment", value: fmtKES(fPayments.length ? Math.round(total / fPayments.length) : 0) },
            { label: "Paid / Partial / Overdue / Waived", value: `${paid} / ${partial} / ${overdue} / ${waived}` },
          ],
        };
      }
      case "Expense Report": {
        const total = fExpenses.reduce((s, e) => s + e.amount, 0);
        const byCat = {};
        fExpenses.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
        const topCat = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
        return {
          columns: [
            { key: "id", label: "Expense ID" },
            { key: "date", label: "Date", render: (r) => fmtDate(r.date), value: (r) => fmtDate(r.date) },
            { key: "category", label: "Category" },
            { key: "vendor", label: "Vendor" },
            { key: "amount", label: "Amount", render: (r) => fmtKES(r.amount), value: (r) => r.amount },
            { key: "remarks", label: "Remarks", sortable: false },
          ],
          rows: fExpenses, total,
          summary: [
            { label: "Total Spent", value: fmtKES(total) }, { label: "Expenses", value: fExpenses.length },
            { label: "Average Expense", value: fmtKES(fExpenses.length ? Math.round(total / fExpenses.length) : 0) },
            { label: "Top Category", value: topCat ? `${topCat[0]} (${fmtKES(topCat[1])})` : "—" },
          ],
        };
      }
      case "Profit & Loss Statement": {
        const income = fPayments.reduce((s, p) => s + p.amount, 0);
        const exp = fExpenses.reduce((s, e) => s + e.amount, 0);
        const rows = [
          { label: "Total Rental Income", amount: income },
          { label: "Total Expenses", amount: -exp },
          { label: "Net Profit", amount: income - exp },
        ];
        return {
          columns: [{ key: "label", label: "Line Item" }, { key: "amount", label: "Amount", render: (r) => fmtKES(r.amount), value: (r) => r.amount }],
          rows, total: income - exp,
          summary: [
            { label: "Income", value: fmtKES(income) }, { label: "Expenses", value: fmtKES(exp) },
            { label: "Margin", value: income ? Math.round(((income - exp) / income) * 100) + "%" : "—" },
          ],
        };
      }
      case "Occupancy Report": {
        const occ = fUnitsByProp.filter(u => u.status === "Occupied").length;
        const vac = fUnitsByProp.filter(u => u.status === "Vacant").length;
        const maint = fUnitsByProp.filter(u => u.status === "Under Maintenance").length;
        const notice = fUnitsByProp.filter(u => u.status === "Notice").length;
        return {
          columns: [
            { key: "unitNo", label: "Unit" },
            { key: "property", label: "Property", render: (r) => properties.find(p => p.id === r.property)?.name, value: (r) => properties.find(p => p.id === r.property)?.name, sortValue: (r) => properties.find(p => p.id === r.property)?.name || "" },
            { key: "type", label: "Type" },
            { key: "status", label: "Status", render: (r) => <Badge status={r.status} />, value: (r) => r.status },
          ],
          rows: fUnitsByProp, total: null,
          summary: [
            { label: "Occupancy Rate", value: fUnitsByProp.length ? Math.round((occ / fUnitsByProp.length) * 100) + "%" : "—" },
            { label: "Occupied", value: occ }, { label: "Vacant", value: vac },
            { label: "Under Maintenance / Notice", value: `${maint} / ${notice}` },
          ],
        };
      }
      case "Rent Arrears Report": {
        const rows = fPayments.filter(p => p.status === "Overdue" || p.status === "Partial")
          .map(p => ({ ...p, balance: computeBalance(units.find(u => u.id === p.unit), p), overdue: daysOverdue(p) }));
        const totalBalance = rows.reduce((s, r) => s + r.balance, 0);
        const avgOverdue = rows.length ? Math.round(rows.reduce((s, r) => s + r.overdue, 0) / rows.length) : 0;
        return {
          columns: [
            { key: "id", label: "Payment ID" },
            { key: "tenant", label: "Tenant", render: (r) => tenants.find(t => t.id === r.tenant)?.name, value: (r) => tenants.find(t => t.id === r.tenant)?.name, sortValue: (r) => tenants.find(t => t.id === r.tenant)?.name || "" },
            { key: "amount", label: "Paid", render: (r) => fmtKES(r.amount), value: (r) => r.amount },
            { key: "balance", label: "Balance Due", render: (r) => fmtKES(r.balance), value: (r) => r.balance },
            { key: "overdue", label: "Days Overdue", value: (r) => r.overdue },
            { key: "status", label: "Status", render: (r) => <Badge status={r.status} />, value: (r) => r.status },
            { key: "remarks", label: "Remarks", sortable: false },
          ],
          rows, total: null,
          summary: [
            { label: "Tenants in Arrears", value: rows.length }, { label: "Total Outstanding", value: fmtKES(totalBalance) },
            { label: "Average Days Overdue", value: avgOverdue },
          ],
        };
      }
      case "Property Performance Report": {
        const totalUnits = fPropsFiltered.reduce((s, p) => s + p.units, 0);
        const active = fPropsFiltered.filter(p => p.status === "Active").length;
        return {
          columns: [
            { key: "name", label: "Property" }, { key: "type", label: "Type" }, { key: "units", label: "Units" },
            { key: "status", label: "Status", render: (r) => <Badge status={r.status} />, value: (r) => r.status },
          ],
          rows: fPropsFiltered, total: null,
          summary: [
            { label: "Properties", value: fPropsFiltered.length }, { label: "Total Units", value: totalUnits },
            { label: "Active Properties", value: active },
          ],
        };
      }
      case "Lease Expiry Report": {
        const rows = (month === "All" && year === "All") ? fUnitsByProp.filter(u => u.leaseEnd) : fUnitsByLease;
        const nearest = rows.length ? rows.slice().sort((a, b) => a.leaseEnd.localeCompare(b.leaseEnd))[0] : null;
        return {
          columns: [
            { key: "unitNo", label: "Unit" },
            { key: "property", label: "Property", render: (r) => properties.find(p => p.id === r.property)?.name, value: (r) => properties.find(p => p.id === r.property)?.name, sortValue: (r) => properties.find(p => p.id === r.property)?.name || "" },
            { key: "agent", label: "Caretaker/Agent" },
            { key: "leaseEnd", label: "Lease End", render: (r) => fmtDate(r.leaseEnd), value: (r) => fmtDate(r.leaseEnd) },
          ],
          rows, total: null,
          summary: [
            { label: "Leases Expiring", value: rows.length },
            { label: "Nearest Expiry", value: nearest ? `${nearest.unitNo} — ${fmtDate(nearest.leaseEnd)}` : "—" },
          ],
        };
      }
      case "Maintenance Cost Report": {
        const total = fMaintenance.reduce((s, m) => s + m.estCost, 0);
        const open = fMaintenance.filter(m => m.status === "Open").length;
        const inProgress = fMaintenance.filter(m => m.status === "In Progress").length;
        const completed = fMaintenance.filter(m => m.status === "Completed").length;
        return {
          columns: [
            { key: "id", label: "Ticket" },
            { key: "property", label: "Property", render: (r) => properties.find(p => p.id === r.property)?.name, value: (r) => properties.find(p => p.id === r.property)?.name, sortValue: (r) => properties.find(p => p.id === r.property)?.name || "" },

            { key: "status", label: "Status", render: (r) => <Badge status={r.status} />, value: (r) => r.status },
            { key: "remarks", label: "Remarks", sortable: false },
          ],

          ],
        };
      }
      default: return { columns: [], rows: [], total: null, summary: [] };
    }
  }, [reportType, properties, units, tenants, fPayments, fExpenses, fMaintenance, fUnitsByLease, fUnitsByProp, fPropsFiltered, month, year]);

  function exportCsv() {
    downloadCSV(reportType.replace(/\s+/g, "_").toLowerCase() + ".csv", toCSV(data.rows, data.columns));

  function exportPdf() {
    exportPDF({

  return (
