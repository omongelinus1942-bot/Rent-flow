        {activeFilters.includes("tenant") && <Select value={tenantFilter} onChange={setTenantFilter} options={tenantOptions} dark={dark} />}
        {activeFilters.includes("category") && <Select value={categoryFilter} onChange={setCategoryFilter} options={reportType === "Maintenance Cost Report" ? MAINTENANCE_CATEGORIES : EXPENSE_CATEGORIES} dark={dark} />}
        <div className="flex-1" />
        <MonthYearFilter month={month} year={year} onMonth={setMonth} onYear={setYear} dark={dark} />
        <Button variant="secondary" dark={dark} icon="download" onClick={exportCsv}>CSV</Button>
        <Button variant="secondary" dark={dark} icon="picture_as_pdf" onClick={exportPdf}>PDF</Button>
      </Toolbar>
      <Card dark={dark} className="p-5">
        <div className="flex items-center justify-between mb-4 flex-wrap gap-2">

// A small grid of View/Edit checkboxes, one row per app section — how an admin
// decides exactly what a user can see and change.
function PermissionsGrid({ dark, permissions, onChange }) {
  const txt = dark ? COLORS.textDark : COLORS.textLight;
  const sub = dark ? COLORS.subDark : COLORS.subLight;
  const border = dark ? COLORS.borderDark : COLORS.borderLight;
  function toggle(key, field) {
    const current = permissions[key] || { view: false, edit: false };
    const next = { ...current, [field]: !current[field] };
    if (field === "edit" && next.edit) next.view = true; // edit implies view
    onChange({ ...permissions, [key]: next });
  }
  return (
    <div className="rounded-xl overflow-hidden border" style={{ borderColor: border }}>
      <table className="w-full text-sm">
        <thead>
          <tr style={{ background: dark ? "#17293B" : "#F6F7F9" }}>
            <th className="text-left px-3 py-2 font-medium" style={{ color: sub }}>Section</th>
            <th className="text-center px-3 py-2 font-medium" style={{ color: sub }}>View</th>
            <th className="text-center px-3 py-2 font-medium" style={{ color: sub }}>Edit</th>
          </tr>
        </thead>
        <tbody>
          {NAV_ITEMS.map((n) => {
            const p = permissions[n.key] || { view: false, edit: false };
            return (
              <tr key={n.key} style={{ borderTop: `1px solid ${border}` }}>
                <td className="px-3 py-2" style={{ color: txt }}>
                  <span className="inline-flex items-center gap-2"><Icon name={n.icon} size={15} style={{ color: sub }} />{n.label}</span>
                </td>
                <td className="text-center px-3 py-2">
                  <input type="checkbox" checked={!!p.view} onChange={() => toggle(n.key, "view")} className="w-4 h-4" />
                </td>
                <td className="text-center px-3 py-2">
                  <input type="checkbox" checked={!!p.edit} onChange={() => toggle(n.key, "edit")} className="w-4 h-4" />
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function CreateUserModal({ dark, accountId, onClose, onCreated }) {
  const [name, setName] = useState("");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [permissions, setPermissions] = useState(blankPermissions(false));
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError("");
    if (!name.trim() || !username.trim() || password.length < 6) {
      setError("Please fill in name, username, and a password of at least 6 characters.");
      return;
    }
    setBusy(true);
    const usernameKey = username.trim().toLowerCase();
    const email = usernameToEmail(usernameKey);
    try {
      const existing = await db.collection("usernames").doc(usernameKey).get();
      if (existing.exists) throw new Error("That username is already taken.");

      // Create the new user's auth account on a secondary Firebase app instance so the
      // admin creating them isn't signed out of their own session in the process.
      const secondaryApp = firebase.apps.find(a => a.name === "Secondary") || firebase.initializeApp(window.FIREBASE_CONFIG, "Secondary");
      const secondaryAuth = secondaryApp.auth();
      const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
      const newUid = cred.user.uid;
      await cred.user.updateProfile({ displayName: name.trim() });
      await secondaryAuth.signOut();

      const batch = db.batch();
      batch.set(db.collection("users").doc(newUid), {
        uid: newUid, name: name.trim(), username: usernameKey, email, active: true,
        role: "user", accountId, permissions, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      batch.set(db.collection("usernames").doc(usernameKey), { email, uid: newUid, accountId });
      await batch.commit();

      onCreated();
      onClose();
    } catch (err) {
      setError(err.message || "Could not create user.");
    } finally {
      setBusy(false);
    }
  }

  const card = dark ? COLORS.cardDark : COLORS.cardLight;
  const border = dark ? COLORS.borderDark : COLORS.borderLight;
  const txt = dark ? COLORS.textDark : COLORS.textLight;
  const inputStyle = { background: dark ? "#0F1B28" : "#fff", borderColor: border, color: txt };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,0.5)" }}>
      <form onSubmit={submit} className="w-full max-w-lg rounded-2xl p-5 max-h-[90vh] overflow-y-auto" style={{ background: card }}>
        <h3 className="text-base font-semibold mb-4" style={{ color: txt, fontFamily: "'Sora', sans-serif" }}>Create User</h3>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
          <div>
            <label className="text-xs font-medium block mb-1" style={{ color: txt }}>Full Name</label>
            <input value={name} onChange={(e) => setName(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm outline-none" style={inputStyle} />
          </div>
          <div>
            <label className="text-xs font-medium block mb-1" style={{ color: txt }}>Username</label>
            <input value={username} onChange={(e) => setUsername(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm outline-none" style={inputStyle} />
          </div>
          <div className="sm:col-span-2">
            <label className="text-xs font-medium block mb-1" style={{ color: txt }}>Temporary Password</label>
            <RevealableField value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="new-password" style={inputStyle} />
          </div>
        </div>
        <p className="text-xs font-medium mb-2" style={{ color: txt }}>Access — pick what this user can see and change</p>
        <PermissionsGrid dark={dark} permissions={permissions} onChange={setPermissions} />
        {error && <p className="text-xs mt-3" style={{ color: COLORS.red }}>{error}</p>}
        <div className="flex justify-end gap-2 mt-5">
          <button type="button" onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium border" style={{ borderColor: border, color: txt }}>Cancel</button>
          <button type="submit" disabled={busy} className="px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ background: COLORS.orange, opacity: busy ? 0.6 : 1 }}>{busy ? "Creating…" : "Create User"}</button>
        </div>
      </form>
    </div>
  );
}

  // Keep the form in sync if the account doc changes elsewhere (e.g. another admin tab).
  useEffect(() => {
    setName(businessInfo.name || ""); setAddress(businessInfo.address || "");
    setContact(businessInfo.contact || ""); setLogo(businessInfo.logo || "");
  }, [businessInfo.name, businessInfo.address, businessInfo.contact, businessInfo.logo]);

    try {
      await db.collection("accounts").doc(currentUser.accountId).update({
        businessName: name.trim(), businessAddress: address.trim(), businessContact: contact.trim(),

      setLogoBusy(false);

        </div>
        <div>
          <p className="text-xs font-medium mb-1" style={{ color: txt }}>Business Logo</p>

              {logoBusy ? "Uploading…" : logo ? "Replace Logo" : "Upload Logo"}

          {logoError && <p className="text-xs mt-1" style={{ color: COLORS.red }}>{logoError}</p>}
          <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={handleLogoFile} />
        </div>

      <form onSubmit={save} className="grid grid-cols-1 sm:grid-cols-3 gap-3">

          <label className="text-xs font-medium block mb-1" style={{ color: txt }}>Business Name</label>

function SampleDataCard({ dark, accountId }) {
  const [busy, setBusy] = useState(""); // "" | "clearing" | "reloading"
  const [message, setMessage] = useState("");
  const border = dark ? COLORS.borderDark : COLORS.borderLight;
  const txt = dark ? COLORS.textDark : COLORS.textLight;
  const sub = dark ? COLORS.subDark : COLORS.subLight;

  async function handleClear() {
    if (!window.confirm("Clear all sample data? This removes every portfolio, property, unit, tenant, payment, expense, income entry, and maintenance ticket in this account. This can't be undone.")) return;
    setBusy("clearing"); setMessage("");
    try {
      for (const { name } of SAMPLE_COLLECTIONS) await clearSampleCollection(accountId, name);
      setMessage("Sample data cleared.");
    } catch (e) {
      console.error("Clear sample data failed:", e);
      setMessage("Something went wrong clearing sample data.");
    } finally {
      setBusy("");
    }
  }

  async function handleReload() {
    if (!window.confirm("Reload sample data? This clears whatever is currently in this account and replaces it with the original demo data.")) return;
    setBusy("reloading"); setMessage("");
    try {
      for (const { name } of SAMPLE_COLLECTIONS) await clearSampleCollection(accountId, name);
      for (const { name, seed } of SAMPLE_COLLECTIONS) await seedSampleCollection(accountId, name, seed);
      setMessage("Sample data reloaded.");
    } catch (e) {
      console.error("Reload sample data failed:", e);
      setMessage("Something went wrong reloading sample data.");
    } finally {
      setBusy("");
    }
  }

  return (
    <Card dark={dark} className="p-4 mb-4">
      <p className="text-sm font-semibold mb-1" style={{ color: txt, fontFamily: "'Sora', sans-serif" }}>Sample Data</p>
      <p className="text-xs mb-3" style={{ color: sub }}>This account started out pre-loaded with demo portfolios, properties, tenants, and transactions so you could try things out. Clear it once you're ready to use real data, or reload it while you're still testing.</p>
      <div className="flex flex-wrap items-center gap-3">
        <button type="button" onClick={handleClear} disabled={!!busy} className="text-xs font-medium px-3 py-2 rounded-lg border" style={{ borderColor: border, color: COLORS.red, opacity: busy ? 0.6 : 1 }}>
          {busy === "clearing" ? "Clearing…" : "Clear Sample Data"}
        </button>
        <button type="button" onClick={handleReload} disabled={!!busy} className="text-xs font-medium px-3 py-2 rounded-lg border" style={{ borderColor: border, color: txt, opacity: busy ? 0.6 : 1 }}>
          {busy === "reloading" ? "Reloading…" : "Reload Sample Data"}
        </button>
        {message && <span className="text-xs" style={{ color: message.startsWith("Something") ? COLORS.red : COLORS.green }}>{message}</span>}
      </div>
    </Card>
  );
}

function SettingsPage({ dark, currentUser, businessInfo }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showCreate, setShowCreate] = useState(false);
  const [editingUser, setEditingUser] = useState(null);

  const card = dark ? COLORS.cardDark : COLORS.cardLight;
  const border = dark ? COLORS.borderDark : COLORS.borderLight;
  const txt = dark ? COLORS.textDark : COLORS.textLight;
  const sub = dark ? COLORS.subDark : COLORS.subLight;

  const loadUsers = useCallback(() => {
    if (!db) return;
    setLoading(true);
    db.collection("users").where("accountId", "==", currentUser.accountId).get()
      .then((snap) => setUsers(snap.docs.map((d) => d.data())))
      .finally(() => setLoading(false));
  }, [currentUser.accountId]);

  useEffect(() => { loadUsers(); }, [loadUsers]);

  async function savePermissions(u, newPermissions) {
    await db.collection("users").doc(u.uid).update({ permissions: newPermissions });
    setUsers((prev) => prev.map((x) => x.uid === u.uid ? { ...x, permissions: newPermissions } : x));
    setEditingUser(null);
  }

  async function toggleActive(u) {
    const nextActive = u.active === false; // currently inactive -> activate, else deactivate
    await db.collection("users").doc(u.uid).update({ active: nextActive });
    setUsers((prev) => prev.map((x) => x.uid === u.uid ? { ...x, active: nextActive } : x));
  }

  async function deleteUser(u) {
    if (!window.confirm(`Delete ${u.name} (@${u.username})? They will no longer be able to log in. This can't be undone.`)) return;
    const batch = db.batch();
    batch.delete(db.collection("users").doc(u.uid));
    batch.delete(db.collection("usernames").doc(u.username));
    await batch.commit();
    setUsers((prev) => prev.filter((x) => x.uid !== u.uid));
    if (editingUser === u.uid) setEditingUser(null);
  }

  return (
    <div>
      <BusinessInfoCard dark={dark} currentUser={currentUser} businessInfo={businessInfo} />
      <SampleDataCard dark={dark} accountId={currentUser.accountId} />

      <div className="flex items-center justify-between mb-4">
        <p className="text-sm" style={{ color: sub }}>Create users for your account and control exactly which sections each one can view or edit. New users log in directly with their username and password — no access code needed.</p>
        <Button icon="person_add" onClick={() => setShowCreate(true)}>Create User</Button>
      </div>

      <Card dark={dark} className="p-4">
        {loading ? (
          <p className="text-sm py-6 text-center" style={{ color: sub }}>Loading users…</p>
        ) : users.length === 0 ? (
          <p className="text-sm py-6 text-center" style={{ color: sub }}>No users created yet.</p>
        ) : (
          <div className="divide-y" style={{ borderColor: border }}>
            {users.map((u) => {
              const isInactive = u.active === false;
              return (
              <div key={u.uid} className="py-3" style={{ borderTop: `1px solid ${border}` }}>
                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <div>
                    <p className="text-sm font-medium flex items-center gap-2" style={{ color: txt }}>
                      {u.name}
                      {u.role === "admin" && <span className="text-xs font-normal" style={{ color: sub }}>(Administrator)</span>}
                      {isInactive && <span className="text-[11px] font-medium px-1.5 py-0.5 rounded" style={{ background: dark ? "#3A2432" : "#FDECEC", color: COLORS.red }}>Deactivated</span>}
                    </p>
                    <p className="text-xs" style={{ color: sub }}>@{u.username}</p>
                  </div>
                  {u.role !== "admin" && (
                    <div className="flex items-center gap-2">
                      <button onClick={() => setEditingUser(editingUser === u.uid ? null : u.uid)} className="text-xs font-medium px-3 py-1.5 rounded-lg border" style={{ borderColor: border, color: txt }}>
                        {editingUser === u.uid ? "Close" : "Edit Access"}
                      </button>
                      <button onClick={() => toggleActive(u)} className="text-xs font-medium px-3 py-1.5 rounded-lg border" style={{ borderColor: border, color: isInactive ? COLORS.green : COLORS.orange }}>
                        {isInactive ? "Activate" : "Deactivate"}
                      </button>
                      <button onClick={() => deleteUser(u)} className="text-xs font-medium px-3 py-1.5 rounded-lg border" style={{ borderColor: border, color: COLORS.red }}>
                        Delete
                      </button>
                    </div>
                  )}
                </div>
                {editingUser === u.uid && (
                  <div className="mt-3">
                    <UserPermissionsEditor dark={dark} user={u} onSave={(perms) => savePermissions(u, perms)} />
                  </div>
                )}
              </div>
              );
            })}
          </div>
        )}
      </Card>

      {showCreate && <CreateUserModal dark={dark} accountId={currentUser.accountId} onClose={() => setShowCreate(false)} onCreated={loadUsers} />}
    </div>
  );
}

function UserPermissionsEditor({ dark, user, onSave }) {
  const [permissions, setPermissions] = useState(user.permissions || blankPermissions(false));
  return (
    <div>
      <PermissionsGrid dark={dark} permissions={permissions} onChange={setPermissions} />
      <div className="flex justify-end mt-3">
        <Button icon="save" onClick={() => onSave(permissions)}>Save Access</Button>
      </div>
    </div>
  );
}

// currentUser: { uid, name, username, role: "admin"|"user", accountId, permissions }
function App({ currentUser, onLogout }) {
  const [dark, setDark] = useState(false);
  const [page, setPage] = useState("dashboard");
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);

  const accountId = currentUser.accountId;
  const isAdmin = currentUser.role === "admin";
  const permissions = currentUser.permissions || {};

  const [portfolios, setPortfolios] = useFirestoreCollection(accountId, "portfolios", PORTFOLIOS);
  const [properties, setProperties] = useFirestoreCollection(accountId, "properties", PROPERTIES);
  const [units, setUnits] = useFirestoreCollection(accountId, "units", UNITS);
  const [tenants, setTenants] = useFirestoreCollection(accountId, "tenants", TENANTS);
  const [payments, setPayments] = useFirestoreCollection(accountId, "payments", paymentSeed);
  const [expenses, setExpenses] = useFirestoreCollection(accountId, "expenses", expenseSeed);
  const [income, setIncome] = useFirestoreCollection(accountId, "income", incomeSeed);
  const [maintenance, setMaintenance] = useFirestoreCollection(accountId, "maintenance", maintenanceSeed);

  const [businessInfo, setBusinessInfoState] = useState({ name: "", address: "", contact: "", logo: "" });
  useEffect(() => {
    if (!db || !accountId) return;
    const unsub = db.collection("accounts").doc(accountId).onSnapshot((snap) => {
      const d = snap.data() || {};
      const info = { name: d.businessName || "", address: d.businessAddress || "", contact: d.businessContact || "", logo: d.businessLogo || "" };
      setBusinessInfoState(info);
      setBusinessInfo(info); // keeps the global used by exportPDF/toCSV in sync
    });
    return unsub;
  }, [accountId]);

  // Every account effectively has "dashboard"; admins see & edit everything by default.
  const visibleNav = NAV_ITEMS.filter(n => isAdmin || permissions[n.key]?.view);
  const navKeys = visibleNav.map(n => n.key);
  const activePage = (page === "settings" || navKeys.includes(page)) ? page : (navKeys[0] || "dashboard");
  const canEditActive = isAdmin || !!permissions[activePage]?.edit;
  const access = { nav: navKeys, canEdit: canEditActive, canDelete: isAdmin && canEditActive };
  const sidebarItems = isAdmin ? [...visibleNav, { key: "settings", label: "Settings", icon: "settings" }] : visibleNav;

  const bg = dark ? COLORS.bgDark : COLORS.bgLight;
  const txt = dark ? COLORS.textDark : COLORS.textLight;
  const sub = dark ? COLORS.subDark : COLORS.subLight;

  const pageProps = { dark, portfolios, setPortfolios, properties, setProperties, units, setUnits, tenants, setTenants, payments, setPayments, expenses, setExpenses, income, setIncome, maintenance, setMaintenance, access };

  function renderPage() {
    switch (activePage) {
      case "dashboard": return <Dashboard {...pageProps} />;
      case "portfolios": return <PortfoliosPage {...pageProps} />;
      case "properties": return <PropertiesPage {...pageProps} />;
      case "units": return <UnitsPage {...pageProps} />;
      case "tenants": return <TenantsPage {...pageProps} />;
      case "payments": return <PaymentsPage {...pageProps} />;
      case "arrears": return <ArrearsPage {...pageProps} />;
      case "income": return <IncomePage {...pageProps} />;
      case "expenses": return <ExpensesPage {...pageProps} />;
      case "maintenance": return <MaintenancePage {...pageProps} />;
      case "reports": return <ReportsPage {...pageProps} />;
      case "settings": return isAdmin ? <SettingsPage dark={dark} currentUser={currentUser} businessInfo={businessInfo} /> : null;
      default: return null;
    }
  }

  return (
    <div style={{ background: bg, minHeight: "100vh", fontFamily: "'Inter', sans-serif", color: txt }} className="flex">
      <style>{`

        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: ${dark ? "#2A3B4D" : "#D7DBE0"}; border-radius: 8px; }

      {/* Sidebar - desktop */}
      <aside className={`hidden md:flex flex-col shrink-0 transition-all duration-200 ${sidebarOpen ? "w-60" : "w-[72px]"}`}
        style={{ background: COLORS.navy, borderRight: `1px solid ${COLORS.navyDeep}` }}>
        <div className="flex items-center gap-2.5 px-4 h-16 shrink-0" style={{ borderBottom: `1px solid #1C3A56` }}>
          <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style={{ background: COLORS.gold }}>
            <Icon name="apartment" size={17} color={COLORS.navy} />
          </div>
          {sidebarOpen && <span className="font-semibold text-sm text-white truncate" style={{ fontFamily: "'Sora', sans-serif" }}>RentFlow</span>}
        </div>
        <nav className="flex-1 py-3 px-2.5 flex flex-col gap-1 overflow-y-auto">

          <Icon name="menu" size={15} /> {sidebarOpen && "Collapse"}

            <div className="flex items-center justify-between px-4 h-16 shrink-0" style={{ borderBottom: "1px solid #1C3A56" }}>
              <span className="font-semibold text-sm text-white" style={{ fontFamily: "'Sora', sans-serif" }}>RentFlow</span>
              <button onClick={() => setMobileNavOpen(false)}><Icon name="close" size={18} color="#fff" /></button>
            </div>
            <nav className="flex-1 py-3 px-2.5 flex flex-col gap-1">
              {sidebarItems.map((n) => {
                const isActive = activePage === n.key;
                return (
                  <button key={n.key} onClick={() => { setPage(n.key); setMobileNavOpen(false); }}
                    className="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium"
                    style={{ background: isActive ? "#1C3A56" : "transparent", color: isActive ? "#fff" : "#9FB2C4" }}>

                  </button>

              })}

          </div>
          <div className="flex-1" style={{ background: "#00000066" }} onClick={() => setMobileNavOpen(false)} />
        </div>
      )}

      {/* Main */}
      <div className="flex-1 min-w-0 flex flex-col">
        <header className="h-16 flex items-center justify-between px-4 md:px-6 shrink-0" style={{ background: COLORS.orange, boxShadow: dark ? "0 1px 0 rgba(0,0,0,0.25)" : "0 1px 0 rgba(0,0,0,0.06)" }}>
          <div className="flex items-center gap-3 min-w-0">
            <button onClick={() => setMobileNavOpen(true)} className="md:hidden p-1.5"><Icon name="menu" size={20} style={{ color: "#fff" }} /></button>
            <div className="min-w-0">
              <h1 className="text-base md:text-lg font-semibold truncate" style={{ fontFamily: "'Sora', sans-serif", color: "#fff" }}>{PAGE_TITLES[activePage]}</h1>
              <p className="text-xs hidden sm:block" style={{ color: "rgba(255,255,255,0.82)" }}>{portfolios.length} portfolio{portfolios.length === 1 ? "" : "s"} · {properties.length} properties · {units.length} units</p>
            </div>
          </div>
          <div className="flex items-center gap-2 md:gap-3 shrink-0">
            <div className="hidden sm:flex flex-col items-end leading-tight mr-1">
              <span className="text-xs font-medium" style={{ color: "#fff" }}>{currentUser.name}</span>
              <span className="text-[11px]" style={{ color: "rgba(255,255,255,0.75)" }}>{isAdmin ? "Administrator" : "User"}</span>

// A text input with an eye icon to toggle showing the raw value — used for
// passwords and the access code so people can double-check what they typed.
function RevealableField({ value, onChange, placeholder, autoComplete, style }) {
  const [visible, setVisible] = useState(false);
  return (
    <div className="relative">
      <input
        type={visible ? "text" : "password"}
        value={value}
        onChange={onChange}
        autoComplete={autoComplete}
        placeholder={placeholder}
        className="w-full px-3 py-2.5 pr-10 rounded-lg border text-sm outline-none"
        style={style}
      />
      <button
        type="button"
        onClick={() => setVisible(v => !v)}
        tabIndex={-1}
        className="absolute right-2.5 top-1/2 -translate-y-1/2"
        style={{ color: COLORS.subLight }}
        aria-label={visible ? "Hide value" : "Show value"}
      >
        <Icon name={visible ? "visibility_off" : "visibility"} size={17} />
      </button>
    </div>
  );
}

function AuthLayout({ children }) {

function LoginScreen({ onSwitch, externalError, onAuthSuccess }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError("");
    if (!username.trim() || !password) { setError("Enter your username and password."); return; }
    setBusy(true);
    try {
      const usernameKey = username.trim().toLowerCase();
      // Usernames map to emails deterministically, so we can sign in directly
      // instead of spending a round trip looking the email up first.
      const email = usernameToEmail(usernameKey);
      const cred = await auth.signInWithEmailAndPassword(email, password);
      // Fetch the profile ourselves and hand off straight to the app — this skips
      // the extra render-cycle round trip of waiting on RootApp's own listener.
      const doc = await db.collection("users").doc(cred.user.uid).get();
      const data = doc.exists ? doc.data() : null;
      if (data && data.active === false) {
        await auth.signOut();
        setError("This account has been deactivated. Contact your administrator.");
        setBusy(false);
        return;
      }
      if (data) { onAuthSuccess({ authUser: cred.user, profile: data }); return; }
      // If for some reason the profile couldn't be read, RootApp's own
      // onAuthStateChanged listener will still pick this sign-in up.
    } catch (err) {
      setError(err.code === "auth/wrong-password" || err.code === "auth/invalid-credential" || err.code === "auth/user-not-found" ? "Incorrect username or password." : (err.message || "Could not sign in."));
      setBusy(false);
    }
  }

  const shownError = error || externalError;

  return (
    <AuthLayout>
      <h2 className="text-lg font-semibold mb-1" style={{ fontFamily: "'Sora', sans-serif", color: COLORS.textLight }}>Log In</h2>
      <p className="text-sm mb-5" style={{ color: COLORS.subLight }}>Welcome back — sign in to your account.</p>
      <form onSubmit={submit} className="space-y-3">
        <div>
          <label className="text-xs font-medium block mb-1" style={{ color: COLORS.textLight }}>Username</label>
          <input value={username} onChange={(e) => setUsername(e.target.value)} autoComplete="username" className="w-full px-3 py-2.5 rounded-lg border text-sm outline-none" style={{ borderColor: COLORS.borderLight }} />
        </div>
        <div>
          <label className="text-xs font-medium block mb-1" style={{ color: COLORS.textLight }}>Password</label>
          <RevealableField value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="current-password" style={{ borderColor: COLORS.borderLight }} />
        </div>
        {shownError && <p className="text-xs" style={{ color: COLORS.red }}>{shownError}</p>}
        <button type="submit" disabled={busy} className="w-full py-2.5 rounded-lg text-sm font-semibold text-white mt-1" style={{ background: COLORS.orange, opacity: busy ? 0.6 : 1 }}>{busy ? "Signing in…" : "Log In"}</button>
      </form>
      <p className="text-xs text-center mt-5" style={{ color: COLORS.subLight }}>
        Setting up a new account? <button onClick={onSwitch} className="font-medium" style={{ color: COLORS.orange }}>Create one</button>
      </p>
    </AuthLayout>
  );
}

function SignupScreen({ onSwitch, onAuthSuccess }) {
  const [name, setName] = useState("");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [accessCode, setAccessCode] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError("");
    if (!name.trim() || !username.trim() || password.length < 6) {
      setError("Fill in your name, username, and a password of at least 6 characters."); return;
    }
    if (accessCode !== SIGNUP_ACCESS_CODE) { setError("Invalid access code."); return; }
    setBusy(true);
    const usernameKey = username.trim().toLowerCase();
    const email = usernameToEmail(usernameKey);
    try {
      const existing = await db.collection("usernames").doc(usernameKey).get();
      if (existing.exists) throw new Error("That username is already taken.");

      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const newUid = cred.user.uid;
      await cred.user.updateProfile({ displayName: name.trim() });

      // The person who signs up with the access code becomes the Administrator of a
      // brand-new account; everyone they later create in Settings shares this accountId.
      const permissions = blankPermissions(true);
      const profile = {
        uid: newUid, name: name.trim(), username: usernameKey, email, active: true,
        role: "admin", accountId: newUid, permissions,
      };
      const batch = db.batch();
      batch.set(db.collection("accounts").doc(newUid), { name: name.trim() + "'s Account", ownerUid: newUid, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      batch.set(db.collection("users").doc(newUid), { ...profile, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      batch.set(db.collection("usernames").doc(usernameKey), { email, uid: newUid, accountId: newUid });
      await batch.commit();
      // We already have everything the new account needs — hand off directly
      // instead of waiting on a fresh Firestore read via onAuthStateChanged.
      onAuthSuccess({ authUser: cred.user, profile });
    } catch (err) {
      setError(err.code === "auth/email-already-in-use" ? "That username is already taken." : (err.message || "Could not create account."));
      setBusy(false);
    }
  }

  return (
    <AuthLayout>
      <h2 className="text-lg font-semibold mb-1" style={{ fontFamily: "'Sora', sans-serif", color: COLORS.textLight }}>Create Account</h2>
      <p className="text-sm mb-5" style={{ color: COLORS.subLight }}>Registering a new account requires an access code. You'll become its Administrator.</p>
      <form onSubmit={submit} className="space-y-3">
        <div>
          <label className="text-xs font-medium block mb-1" style={{ color: COLORS.textLight }}>Full Name</label>
          <input value={name} onChange={(e) => setName(e.target.value)} className="w-full px-3 py-2.5 rounded-lg border text-sm outline-none" style={{ borderColor: COLORS.borderLight }} />
        </div>
        <div>
          <label className="text-xs font-medium block mb-1" style={{ color: COLORS.textLight }}>Username</label>
          <input value={username} onChange={(e) => setUsername(e.target.value)} autoComplete="username" className="w-full px-3 py-2.5 rounded-lg border text-sm outline-none" style={{ borderColor: COLORS.borderLight }} />
        </div>
        <div>
          <label className="text-xs font-medium block mb-1" style={{ color: COLORS.textLight }}>Password</label>
          <RevealableField value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="new-password" style={{ borderColor: COLORS.borderLight }} />
        </div>
        <div>
          <label className="text-xs font-medium block mb-1" style={{ color: COLORS.textLight }}>Access Code</label>
          <RevealableField value={accessCode} onChange={(e) => setAccessCode(e.target.value)} autoComplete="off" style={{ borderColor: COLORS.borderLight }} />
        </div>
        {error && <p className="text-xs" style={{ color: COLORS.red }}>{error}</p>}
        <button type="submit" disabled={busy} className="w-full py-2.5 rounded-lg text-sm font-semibold text-white mt-1" style={{ background: COLORS.orange, opacity: busy ? 0.6 : 1 }}>{busy ? "Creating account…" : "Create Account"}</button>
      </form>
      <p className="text-xs text-center mt-5" style={{ color: COLORS.subLight }}>
        Already have an account? <button onClick={onSwitch} className="font-medium" style={{ color: COLORS.orange }}>Log in</button>
      </p>
    </AuthLayout>
  );
}

function ConfigWarning() {
  return (
    <AuthLayout>
      <h2 className="text-lg font-semibold mb-2" style={{ fontFamily: "'Sora', sans-serif", color: COLORS.red }}>Firebase Not Configured</h2>
      <p className="text-sm" style={{ color: COLORS.subLight }}>
        Add your Firebase project's config to <code>window.FIREBASE_CONFIG</code> near the top of this file (and enable Email/Password auth + Firestore in the Firebase console) before logging in or creating an account.
      </p>
    </AuthLayout>
  );
}

/* ============================== ROOT: AUTH GATE ============================== */
function RootApp() {
  const [authUser, setAuthUser] = useState(undefined); // undefined = loading, null = signed out
  const [profile, setProfile] = useState(null);
  const [screen, setScreen] = useState("login");
  const [blockedMessage, setBlockedMessage] = useState("");

  useEffect(() => {
    if (!auth) { setAuthUser(null); return; }
    const unsub = auth.onAuthStateChanged(async (u) => {
      if (!u) { setAuthUser(null); setProfile(null); return; }
      try {
        const doc = await db.collection("users").doc(u.uid).get();
        const data = doc.exists ? doc.data() : null;
        if (data && data.active === false) {
          // Account was deactivated by an admin — sign them back out immediately.
          await auth.signOut();
          setAuthUser(null); setProfile(null);
          setBlockedMessage("This account has been deactivated. Contact your administrator.");
          return;
        }
        setAuthUser(u);
        setProfile(data);
      } catch (e) {
        console.error("Failed to load user profile:", e);
        setAuthUser(u);
        setProfile(null);
      }
    });
    return unsub;
  }, []);

  if (!window.FIREBASE_CONFIGURED) return <ConfigWarning />;
  if (authUser === undefined) return <div id="loading">Loading RentFlow…</div>;
  if (!authUser) {
    return screen === "login"
      ? <LoginScreen onSwitch={() => { setScreen("signup"); setBlockedMessage(""); }} externalError={blockedMessage} />
      : <SignupScreen onSwitch={() => { setScreen("login"); setBlockedMessage(""); }} />;
  }
  if (!profile) return <div id="loading">Loading your account…</div>;

  return <App currentUser={profile} onLogout={() => auth.signOut()} />;
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<RootApp />);
